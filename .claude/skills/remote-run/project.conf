# remote-run: the jnext specifics. remote-run.sh reads this file (bash syntax) and names no
# project itself. Every value can be overridden by the environment variable of the same name
# prefixed REMOTE_RUN_ (e.g. REMOTE_RUN_REPO_URL), which the contract test and the local
# end-to-end proof use.

PROJECT=jnext
# Environment variable that holds the SSH alias (~/.ssh/config has host, port, user).
# Unset means remote runs are off: the driver exits 75 and the caller runs locally.
HOST_ENV_VAR=JNEXT_REMOTE_RUN_HOST
# Where the remote clones from; the branch must be pushed there before a run.
REPO_URL=https://github.com/jorgegv/jnext.git
DEFAULT_BRANCH=main
# ALL work data on the remote lives under ONE directory: the mirror, per-run checkouts, temp
# files, the lane lock, the cache directories below, and podman's image storage. The
# environment variable below names it per session; a leading ~/ is expanded on the remote.
DIR_ENV_VAR=JNEXT_REMOTE_RUN_DIR
DIR_DEFAULT='~/remote-jnext-work'

# Container image: BASE_IMAGE plus the packages `DEPS_SCRIPT DEPS_ARGS` installs (a script of
# the repo itself, read at the run's commit). The image tag is a hash of all three.
BASE_IMAGE=docker.io/library/fedora:45
DEPS_SCRIPT=test/ci-deps.sh
DEPS_ARGS="test mingw mingw-qt"
# Run inside the container, in the checkout, before the targets. `make sdcard-image` is a no-op
# (a probe, nothing built) while the lane's SD master is current; the first run of a lane whose SD
# home is empty (lane 2) downloads it there through jnext's own provisioning, BEFORE any target.
# `unit-test` and `traceability-check` list `sdcard-image` as a prerequisite (provisioned before the
# build and the suites run), so for them this is redundant; `regression-rows` and the other targets
# that read the card without listing it need the card at once.
BOOTSTRAP_CMD="make worktree-bootstrap && make sdcard-image"

# subdirectory-of-<dir>/cache:mount-point pairs; bind-mounted into the container, they survive runs.
# The whole ~/.jnext is ONE mount: the SD master (.jnext/sdcard) and every run's private clone and
# scratch (.jnext/runs/...) must be on the same filesystem, or the per-run clone cannot be a reflink
# (the regression row sdcard-isolation-func checks exactly that).
CACHE_MOUNTS="ccache:/root/.cache/ccache tools:/root/.cache/jnext jnext-home:/root/.jnext"
# old:new pairs (relative to <dir>/cache) moved once, under the setup lock, when only the old one exists.
CACHE_MIGRATE="sdcard:jnext-home/sdcard"
# subdirectories of <dir>/cache whose entries older than a day are removed (each lane sweeps its own
# LANE_CACHES copy): the scratch of a killed run (a podman kill skips the regression harness's EXIT trap).
CACHE_SWEEP="jnext-home/runs"
# Runs at once on the remote, one lock each. Lane 1 keeps the one-lane names (lane.lock, runs/, ctl/,
# cache/jnext-home, cache/extra-repo); lane n adds -L<n> (runs-L2/, cache/jnext-home-L2, ...). LANE_CACHES
# lists the first path components of CACHE_MOUNTS / CACHE_SWEEP entries that are per lane: the SD home,
# because a run on another distribution re-derives its master and two lanes would keep flipping a shared
# one. Everything else (ccache, tools, the podman store, the mirror) is shared.
LANES=2
LANE_CACHES="jnext-home"
CONTAINER_ENV="LANG=C LC_ALL=C CCACHE_MAXSIZE=20G"

# Caps, PER LANE. JOBS goes to make as `JOBS=<n>` (the Makefile's compile parallelism); HEAVY_TARGET_RE
# picks the targets that link with LTO or PGO, which get the lower value. Basis, from the real nas01 runs
# (12 cores, 32 GB): each result line logs `anon=`, the step's own peak of anonymous memory, which is what
# an OOM depends on. Highest anon per step at -j11: unit-test 8468 MiB (cold ccache; 2.0 GiB warm),
# unit-test-sdl 5427, unit-test-win 4994, unit-test-wasm 2923, wasm-browser-test 2254, regression-win
# 2235, gui-release 1907, regression 1758. A lane's 8.3 GiB plus up to 1 GiB of /dev/shm fits 10g;
# memory.peak reaching the limit is page cache, reclaimed inside the cgroup. Two lanes at their limit are
# 20 GiB, plus the ZFS ARC (capped at 8 GiB, it gives back under pressure) and about 3 GiB for the host.
# CPU caps: a lone lane gets the full JOBS/TEST_JOBS; a lane that STARTS while the other lane is busy runs
# at half of them, rounded up (6/3/6), done by the remote side. Measured on nas01 (2026-11-21), the same
# two cold-compile runs at once (A: unit-test, unit-test-sdl, unit-test-win; B: unit-test,
# unit-test-wasm, wasm-browser-test; every target identical, B started 45 s after A): both lanes at
# JOBS 11 / TEST_JOBS 12: pair makespan 3211 s, steps 1237/242/245 s (A) and 1324/367/1511 s (B), min
# MemAvailable 8.2 GiB, peak load 26; both lanes at 6/3/6: makespan 3251 s (+1.2%, inside the +-8% run-to-run
# spread of the cold unit-test step), steps 1263/230/242 and 1343/363/1536 s, min MemAvailable 12.9 GiB,
# peak load 16, anon peak 4.9 GiB instead of 7.6. Not slower, kinder to the host: so the second lane to start halves
# (the measurement halved both; the rule halves only the lane that finds the other busy). A process killed by the limit is
# logged as `oom` and makes the run NOT CLEAN, never a quiet pass. The driver lowers CONTAINER_MEMORY to
# 80% of the host's memory divided by LANES when that is less. Re-measure wasm-browser-test's anon
# against 10g if its specs go parallel.
JOBS_DEFAULT=11
JOBS_HEAVY=6
HEAVY_TARGET_RE='^(gui-release|gui-release-non-pgo|win-release|win-release-non-pgo|win-sdl-release|package-.*|regression|regression-win|regression-rows|regression-confirm)$'
TEST_JOBS=12
CONTAINER_MEMORY=10g
CONTAINER_SHM=1g
# Seconds: the whole run, and how long to wait for a remote lane (any of them; also the bound on the
# setup lock). The remote is extra capacity, never a queue: a plain run waits only briefly, then exits
# 75 (the caller runs it locally); only --gate waits long.
TIMEOUT_DEFAULT=14400
LANE_WAIT=30
GATE_LANE_WAIT=10800
# The remote refuses (exit 75, the caller runs locally) below these.
MIN_MEM_MB=4096
MIN_DISK_GB=20

# --gate: the batch gate of CLAUDE.md's merge protocol step 2, in order ('|' separates steps; a
# step is a make target or sh:<command>), failing fast. Timeout for the whole gate, in seconds.
GATE_STEPS='clean|gui-release|unit-test|unit-test-sdl|unit-test-win|sh:./build/test/fuse_z80_test build/test/fuse|regression|regression-win|wasm-core|wasm-browser-test|unit-test-wasm|regression-wasm'
TIMEOUT_GATE=36000

# Targets worth sending (a request for anything else only prints a notice).
HEAVY_TARGETS="test-affected unit-test unit-test-sdl unit-test-win unit-test-wasm wasm-browser-test regression regression-rows regression-confirm regression-win regression-wasm gui-release wasm-core fuse-pgo"
# --warm: every tool cache and the SD image, then one build of each test tree to fill ccache.
WARM_TARGETS="sdcard-image z88dk-gdb skoolkit ghidra emsdk playwright unit-test-build unit-test-sdl-build unit-test-win-build unit-test-wasm-build wasm-core"

# A green regression writes its stamp into the directory named by STAMP_ENV inside the
# container; the driver copies it to STAMP_LOCAL_DIR here (so `make regression-stamp-check` sees it).
STAMP_ENV=JNEXT_REGRESSION_STAMP_DIR
STAMP_LOCAL_DIR='${XDG_CACHE_HOME:-$HOME/.cache}/jnext/regression-stamps'

# A second repository the container needs, cloned partially (blobs on demand) with a sparse
# checkout into <dir>/cache/extra-repo, mounted read-only at EXTRA_MOUNT with EXTRA_ENV set.
# The pinned commit is read from EXTRA_REF_FILE at the commit under test by the sed expression
# EXTRA_REF_SED (one 40-hex sha out), so the pin stays in one place. Here: the ZX Next FPGA core,
# the VHDL citation oracle of the traceability matrix check (the `Check out the ZX Next FPGA core`
# step of ci.yml does the same). The run is refused (75) if it cannot be fetched.
EXTRA_REPO_URL=https://gitlab.com/SpectrumNext/ZX_Spectrum_Next_FPGA.git
EXTRA_REF_FILE=.github/workflows/ci.yml
EXTRA_REF_SED='s/^[[:space:]]*FPGA_CORE_REF:[[:space:]]*([0-9a-f]{40}).*/\1/p'
EXTRA_SPARSE=cores/zxnext/src
EXTRA_MOUNT=/fpga-core
EXTRA_ENV=JNEXT_FPGA_SRC=/fpga-core/cores/zxnext/src
