# Classification of the files no compiler depfile can place (GH #547, test/test-affected.pl).
#
# One rule per line: <glob> <action>. Read in order, FIRST MATCH WINS. `**` crosses directories,
# `*` does not. A file that is in a depfile of the build tree is placed by the map and never gets
# here; a tracked file that is in no depfile and matches no rule is UNMAPPED, and one changed
# unmapped file makes the plan FULL (`make unit-test`), named. `make test-affected-check` (part of
# `make unit-test`) fails on a tracked unmapped file, so a new kind of file is classified in the
# change that adds it.
#
# Actions:
#   full          the change can reach anything: run `make unit-test`
#   docs          covered by `make docs-check` alone (the documentation-only rule)
#   ignore        nothing a test reads; a source file that no object of the Linux tree compiles
#                 cannot change a Linux suite (the platform check names the other trees)
#   ci            CI only: nothing runs locally, reported
#   browser       needs `make wasm-browser-test` (heavy: reported, the author runs it)
#   make:<target> run that make target
#   fixture       a runtime file: the suites whose sources or arguments, and the regression row
#                 scripts, name its path or directory; none names it -> full
#   (a rule may list several actions separated by blanks: `ci make:package-contract-test`)
#   row-script    test/00regression/scripts/<row>.sh -> that row (must be declared, else full)
#   row-ref       img/<row>-reference.png -> that row
#   row-conf      the rows named on the changed lines of a regression conf

# The build and the harness.
CMakeLists.txt                              full
**/CMakeLists.txt                           full
**/*.cmake                                  full
cmake/**                                    full
Makefile                                    full
version.yaml                                full
.gitmodules                                 full
test/run-unit-tests.sh                      full
test/unit-tests.conf                        full
test/row_id.h                               full
test/traceability-*                         full
test/test-affected.conf                     make:test-affected-selftest
test/test-affected.pl                       make:test-affected-selftest
test/test-affected-selftest.sh              make:test-affected-selftest
test/SUBSYSTEM-TESTS-STATUS.md              full

# The traceability matrix is generated from the suites' own logs and the plan documents.
doc/testing/TRACEABILITY-MATRIX.md          full
doc/testing/*-TEST-PLAN-DESIGN.md           full

# The regression suite: a row's own files select that row; its harness is FULL.
test/00regression/scripts/*.sh              row-script
test/00regression/img/*-reference.png       row-ref
test/00regression/functional_tests.conf     row-conf
test/00regression/regression_tests.conf     row-conf
test/00regression/**                        full

# Documentation (generated guides and man page included: docs-check proves them).
doc/**                                      docs
src/doc/**                                  docs
mkdocs.yml                                  docs
mkdocs-devguide.yml                         docs
*.md                                        docs
ChangeLog                                   docs
LICENSE                                     docs
releases.yaml                               make:package-contract-test

# Packaging, web, CI.
packaging/**                                make:package-contract-test
test/packaging/**                           make:package-contract-test
web/**                                      browser
src/platform/browser_frontend.*             browser
src/platform/web/**                         browser
test/browser/**                             browser
.github/**                                  ci make:package-contract-test
docker/**                                   ci

# Runtime files: found by the path or directory the suites and rows name.
test/fixtures/**                            fixture
test/fuse/**                                fixture
test/z80n/**                                fixture
roms/**                                     fixture
data/**                                     fixture
demo/**                                     fixture
tools/**                                    fixture
src/toolbar_icons/**                        full
src/gui/icons/**                            full
src/save/jns-schema-overlay.json            make:schema-check
test/scripts/**                             fixture
test/tzx/**                                 fixture
test/wav/**                                 fixture
test/nex/**                                 fixture
src/**/*.ui                                 full
src/**/*.qrc                                full

# Other test-tree scripts and tools: the harness, FULL.
test/**/*.sh                                full
test/**/*.pl                                full
test/**/*.py                                full
test/**/*.mjs                               full
test/**/*.conf                              full
test/**/*.pm                                full
test/**/*.c                                 full
test/lint-assertions.baseline               full

# Sources and headers that no object of this tree compiles (another OS's file, a tool not built
# here, a bench): they cannot change a Linux suite. The platform check reports the other trees.
src/**/*.cpp                                ignore
src/**/*.h                                  ignore
src/**/*.hpp                                ignore
src/**/*.c                                  ignore
src/**/*.mm                                 ignore
test/**/*.cpp                               ignore
test/**/*.h                                 ignore
third_party/**                              ignore
.claude/skills/remote-run/**                make:package-contract-test
.claude/skills/autonomous-run/slot.sh       make:package-contract-test
.claude/**                                  ignore
.prompts/**                                 ignore
**/.gitkeep                                 ignore
test/bench/**                               ignore
test/interactive/**                         ignore
test/nex-nonworking/**                      ignore
.gitignore                                  ignore
