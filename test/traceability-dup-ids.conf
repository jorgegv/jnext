# Known cross-suite test-ID collisions (GH #196 phase 3.2)
#
# An ID is a GLOBAL name in this project — the matrix, the plan docs and every
# report key on it — so two suites asserting the same ID lets one subsystem's
# row vouch for another's. That is exactly how #190's manufactured coverage
# happened.
#
# This file is a BASELINE, not an amnesty. It held the 29 collisions that
# already existed when the gate was introduced (GH #196 phase 3.2), and GH #243
# renamed one side of every one of them, so it is now EMPTY — and is meant to
# stay empty. test/traceability-dup-ids.pl refuses any collision not listed
# here and any entry here that no longer collides; a new collision is fixed by
# renaming one side (its plan doc and its test source together), never by
# adding a line.
#
# The GH #243 renames, all of the side that no plan doc lists:
#   log_gate_test        GATE-*  -> LGATE-*
#   esp_wiring_test      GATE-*  -> EGATE-*,  AT-*  -> EAT-*
#   host_key_latch_test  HK-*    -> HKL-*
#   tick_stats_test      TS-*    -> TKS-*
#   esp_uart_adapter_test LOG-*  -> ALOG-*
#   pointer_capture_test PC-*    -> PCAP-*
#   speed_report_test    SR-*    -> SREP-*
#
# Format: <ID> : <suite>, <suite>[, ...]   — comments and blank lines ignored.
