# Known cross-suite test-ID collisions (GH #196 phase 3.2)
#
# An ID is a GLOBAL name in this project — the matrix, the plan docs and every
# report key on it — so two suites asserting the same ID lets one subsystem's
# row vouch for another's. That is exactly how #190's manufactured coverage
# happened.
#
# This file is a BASELINE, not an amnesty: every entry below already existed
# when the gate was introduced, and test/traceability-dup-ids.pl refuses any
# collision NOT listed here — and any entry here that no longer collides, so
# the list can only shrink on purpose. Shrinking it means renaming one side; a
# renamed row needs its plan doc and its test source changed together.
#
# GH #243 renamed 17 of the original 29 (the GATE-01..11, HK-* and TS-09
# families, which the planned-row check showed were also colliding with plan-doc
# rows): log_gate_test GATE-* -> LGATE-*, esp_wiring_test GATE-* -> EGATE-*,
# host_key_latch_test HK-* -> HKL-*, tick_stats_test TS-* -> TKS-*.
#
# Format: <ID> : <suite>, <suite>[, ...]   — comments and blank lines ignored.

AT-01: esp_at_test, esp_wiring_test
AT-02: esp_at_test, esp_wiring_test
LOG-01: esp_uart_adapter_test, log_test
LOG-02: esp_uart_adapter_test, log_test
LOG-03: esp_uart_adapter_test, log_test
LOG-04: esp_uart_adapter_test, log_test
LOG-06: esp_uart_adapter_test, log_test
PC-05a: pointer_capture_test, present_cadence_test
PC-05b: pointer_capture_test, present_cadence_test
PC-06: pointer_capture_test, present_cadence_test
SR-02: nextreg_integration_test, speed_report_test
SR-04: nextreg_integration_test, speed_report_test
