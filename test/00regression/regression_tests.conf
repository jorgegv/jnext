# Regression test definitions
# Format: test_name machine_type nex_file screenshot_delay_frames [extra_cli_args...]
#
# screenshot_delay_frames is in EMULATED frames, not wall-clock seconds.
# This decouples results from host CPU speed so the same reference
# captures the same emulator state regardless of whether the runner is
# fast or slow. 50 frames ≈ 1 s on a 50 Hz machine; 60 frames ≈ 1 s on
# a 60 Hz machine.
#
# Lines starting with # are comments. Blank lines are ignored.
# Reference images are stored as test/00regression/img/<test_name>-reference.png
# Generator: bash test/00regression/generate-references.sh [test_name…]
#
# `@private-sd` in the extra-args field is a HARNESS sentinel, not a jnext
# flag: scripts/screenshots.sh strips it and gives that row its own SD-card
# clone. Required for any row whose guest WRITES to the card — all other rows
# share one run-wide read-write image, so a writer contaminates them (GH #113).

# expect: 65
#   The number of screenshot tests declared below, pinned. regression.sh FAILS if the
#   count here and the rows below ever disagree. Without it, deleting a test
#   from this file just shrinks both sides of the completeness check together
#   and the suite reports a smaller number as a clean pass. (Review round 2
#   deleted one screenshot row + its reference image and got a green 59/0/0 --
#   this project's own previous baseline. Nobody would have blinked.)
#   Change this number only when you deliberately add or remove a test.

boot-48k          48k     BOOT                150
boot-128k         128k    BOOT                250
boot-plus3        plus3   BOOT                250
# Task 24 (2026-07-10): native NextZXOS boot (FPGA boot ROM → tbblue.fw →
# NextZXOS), first achieved in v0.94.0 — must never regress silently.
# Two capture points, in emulated frames (50 Hz): the NextZXOS welcome
# screen, fully rendered by frame 400 (t=8s), and the main menu after
# SPACE at frame 400 skips the welcome tour (shot at frame 450 = t=9s).
# The menu shows a live RTC date/time row, so --rtc (Task 28) pins the
# clock to a fixed value (ISO 'T' form: this conf's extra-args field is
# split on whitespace, quoting is not supported). The pinned datetime is
# the moment NextZXOS first booted natively in jnext: 2026-07-10 08:55.
boot-nextzxos-welcome next  BOOT              400  --rtc 2026-07-10T08:55:00
boot-nextzxos-menu    next  BOOT              450  --rtc 2026-07-10T08:55:00 --delayed-keypress-frames 400 space
# Task 57 (2026-07-14), closes nmi_test BOOT-DOT-01 / gap G47: end-to-end
# NextZXOS dot-command shell. SPACE@400 skips the welcome tour, DOWN@470 +
# ENTER@500 select "Command Line" (second main-menu entry), then ".ls" is
# typed ('.' = SYM+M compound, keys spaced ≥15 frames — the auto-typer
# holds each key 5 frames) and ENTER@610 runs the esxDOS-style .ls dot
# command from /DOT on the SD image. By frame 800 the root-directory
# listing has printed 19 of 22 entries and sits on the "scroll?" prompt,
# which waits for a key indefinitely — a settled, frame-insensitive
# capture. The reference listing was verified against the image's real
# FAT32 root (mdir): same 22-file count, names, sizes and dates.
# Byte-identical across repeated runs (md5-verified, 2026-07-14).
boot-nextzxos-dotls   next  BOOT              800  --rtc 2026-07-10T08:55:00 --delayed-keypress-frames 400 space --delayed-keypress-frames 470 down --delayed-keypress-frames 500 enter --delayed-keypress-frames 560 . --delayed-keypress-frames 575 l --delayed-keypress-frames 590 s --delayed-keypress-frames 610 enter
# Task 23/25 (2026-07-10): mid-boot splash while tbblue.fw streams ROMs
# through the config-mode NR $04 window. Pre-fix, bank-5 SRAM/VRAM
# aliasing painted this screen with colour garbage; the fixed frame shows
# the clean white-on-black loading log (incl. the Multiface ROM line).
# Locks the dedicated bank-5 VRAM fix (Mmu::bank5_vram_).
# Task 26 (2026-07-11): capture frame moved 260 -> 252. The SD Ncr=2 +
# real-CRC conformance fixes make NextZXOS's boot SD reads slightly more
# efficient, so the boot reaches the splash ~8 frames earlier (stable
# window 248-256). The reference PNG is byte-identical (verified same
# md5) — only the capture point tracks the shifted-but-unchanged splash;
# welcome (400) + menu (450) still 0-diff.
boot-nextzxos-splash  next  BOOT              252  --rtc 2026-07-10T08:55:00
# GH #113 (2026-07-26): the NextZXOS CP/M 80-column tilemap screen. SPACE@400
# skips the welcome tour, five DOWNs + ENTER pick "More..." (last main-menu
# entry) to reach the SECOND menu page, then three DOWNs + ENTER pick "CP/M"
# (4th entry, below Tape Loader / Tape Tester / Interface 2). The CP/M loader
# imports 31 files and settles on "Press SPACE to exit to NextZXOS"; frames
# 3000 and 4000 are byte-identical, so the capture sits well inside a settled
# plateau, and repeated runs are byte-identical (md5-verified 2026-07-26).
#
# WHAT THIS ROW LOCKS. NextZXOS drives CP/M with NR 0x6B = 0xCB (tm enable +
# 80x32 + textmode + 512-tile + tm_on_top), NR 0x15 = 0x00 (SLU) and NR 0x68
# = 0x00 — it does NOT disable the ULA, so the only thing hiding the leftover
# ULA screen content is the tilemap's own paper being OPAQUE (tilemap.vhd:429)
# and above the ULA (tilemap.vhd:388 + zxnext.vhd:7116). jnext used to drop
# text-mode paper pixels, and the ULA bled through the whole screen. The
# reference is byte-identical to the same frame captured with
# --delayed-screenshot-layers tiles, i.e. the ULA contributes nothing.
#
# @private-sd IS LOAD-BEARING: the CP/M loader imports 31 files onto the card,
# and every other row resolves the same run-wide read-write image. Without it,
# tape-save-boot-func and sdcard-readonly-func boot the mutated card and fail
# their frame-400 welcome comparison (reproduced twice, 2026-07-26).
boot-nextzxos-cpm     next  BOOT              3000  @private-sd --rtc 2026-07-10T08:55:00 --delayed-keypress-frames 400 space --delayed-keypress-frames 460 down --delayed-keypress-frames 475 down --delayed-keypress-frames 490 down --delayed-keypress-frames 505 down --delayed-keypress-frames 520 down --delayed-keypress-frames 540 enter --delayed-keypress-frames 620 down --delayed-keypress-frames 635 down --delayed-keypress-frames 650 down --delayed-keypress-frames 670 enter
palette-demo      next    test/00regression/nex/palette_demo.nex           150
copper-demo       next    test/00regression/nex/copper_demo.nex            150
# show512 (GH #181): the only demo in the corpus whose Copper WAIT carries a
# non-trivial hpos — WAIT(line=95, h=52) then MOVE NR $43, flipping the Layer 2
# palette select mid-screen so all 512 colours show at once. copper.vhd:94
# compares that threshold against `hcount_i` = `hc_ula` (zxnext.vhd:3949,:6737),
# a 7 MHz PIXEL counter zeroed at raw hc = c_min_hactive-11 — so the WAIT is
# satisfied in the blanking AFTER line 95 and the palette flip belongs on fb row
# 128. Pre-fix jnext fed the Copper the raw 28 MHz master-cycle offset with
# origin 0, satisfying the same WAIT a quarter into line 95 and landing the flip
# one row early, on fb row 127 — that row is painted from the lower-half palette
# while its neighbours still carry the upper-half one. MEASURED, not assumed:
# reverting the fix (shift_mc=0 + un-shifted hc) fails this row by exactly 1024
# pixels — PNG rows 254-255, i.e. the 512 active columns of fb row 127 doubled,
# (255,146,0) in the reference against (0,73,73) pre-fix, and nothing else.
# copper-demo/beast/parallax all use thresholds 12 and 140, which stay inside
# the same raw row under either model and so cannot see this; this row can.
# Frame 300: the demo is fully settled and static (byte-identical captures from
# frame 60 through 400 — it waits on a keypress), so the frame number is a
# generous margin, not a knife-edge.
show512           next    test/00regression/nex/show512.nex                300
floating-bus      48k     test/00regression/nex/floating_bus_test.nex      150
tilemap-demo      next    test/00regression/nex/tilemap_demo.nex           150
contention-test   48k     test/00regression/nex/contention_test.nex        250
layer2-320x256    next    test/00regression/nex/layer2_320x256_test.nex    150
layer2-640x256    next    test/00regression/nex/layer2_640x256_test.nex    150
sprite-scaling    next    test/00regression/nex/sprite_scaling_test.nex    150
sprite-anchor     next    test/00regression/nex/sprite_anchor_test.nex    150

