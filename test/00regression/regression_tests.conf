layers-beast-tiles   next  test/00regression/nex/beast.nex  100  --delayed-screenshot-layers tiles

# ULA stencil mode (NR 0x68 bit 0) — Task 22b review follow-up, 2026-07-12.
# NO other committed NEX drives stencil mode (verified: zero NR 0x68 bit-0
# writes across all 26), so the compositor's stencil AND-branch had no
# screenshot coverage at all. stencil_test.nex is the minimal fixture:
# bright ULA stripes under a red-tile checkerboard, stencil on, NR 0x4A
# forced to black so a dropped layer is unmistakable.
#
# VHDL zxnext.vhd:7130 takes the AND-branch only when ula_en AND tm_en are
# BOTH set, and stencil_rgb is transparent whenever either input is (7112).
# So masking either layer must fall through to the ordinary ulatm merge
# (7134-7135) and show the survivor. stencil-layers-tiles is the
# discriminative row: with the ula_en half of that gate missing, the tile
# was erased into the black fallback (whole frame black) instead of being
# shown. stencil-demo and stencil-layers-ula are the controls — both are
# byte-identical with and without the bug.
stencil-demo         next  test/00regression/nex/stencil_test.nex  100
stencil-layers-tiles next  test/00regression/nex/stencil_test.nex  100  --delayed-screenshot-layers tiles
stencil-layers-ula   next  test/00regression/nex/stencil_test.nex  100  --delayed-screenshot-layers ula

# LoRes 8-bit mode (GH #63) — the layer shipped with 88 unit/compositor/NextREG
# rows and NO screenshot row at all, so nothing here rendered a LoRes frame and
# a silent break of the ULA-slot substitution would have gone unnoticed.
#
# lores_demo.nex paints bank 5 from Z80 code — deliberately NOT via a NEX
# SCREEN_LORES block, which GH #68 loads as one 12288-byte run instead of two
# 6144-byte halves; a misplaced half is indistinguishable from a missing `+1`
# on lores_addr(13:11). Painting from code isolates the renderer.
#
# Content: a 16x12 grid of 8x8-LoRes-pixel cells, cell (g,b) carrying the
# unique byte (b<<4)|g, with the ULA palette loaded as the identity — so the
# whole expected frame is closed-form from lores.vhd:82/84-87/91/93-94/102/111
# (see demo/lores_demo/derive-lores-reference.py, which recomputes it from the
# VHDL alone and diffs it against this reference). The two halves are written
# to $4000 and $6000 with the 2K attribute gap filled with an out-of-range
# marker, so dropping the `+1` half-skip repaints display rows 96..127 solid
# and shifts the rest up by 16 LoRes rows.
#
# Mutation-proved discriminative (2026-07-22), both reverted after:
#   - `+1` on lores_addr(13:11) removed -> 98304 PNG pixels differ, and the
#     mutated frame is EXACTLY the signature predicted before it was run.
#   - NR $15 bit 7 ignored (the pre-implementation state: bit stored, never
#     read) -> 195712 of 196608 display pixels differ, 192 colours down to 2.
lores-demo        next    test/00regression/nex/lores_demo.nex             150

