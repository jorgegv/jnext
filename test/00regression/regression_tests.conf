# Regression test definitions
# Format: test_name machine_type nex_file screenshot_delay_frames [extra_cli_args...]
#
# screenshot_delay_frames is in EMULATED frames, not wall-clock seconds.
# This decouples results from host CPU speed so the same reference
# captures the same emulator state regardless of whether the runner is
# fast or slow. 50 frames ≈ 1 s on a 50 Hz machine; 60 frames ≈ 1 s on
# a 60 Hz machine.
#
# Lines starting with # are comments. Blank lines are ignored.
# Reference images are stored as test/00regression/img/<test_name>-reference.png
# Generator: bash test/00regression/generate-references.sh [test_name…]

boot-48k          48k     BOOT                150
boot-128k         128k    BOOT                250
boot-plus3        plus3   BOOT                250
boot-pentagon     pentagon BOOT               250
palette-demo      next    test/00regression/nex/palette_demo.nex           150
copper-demo       next    test/00regression/nex/copper_demo.nex            150
floating-bus      48k     test/00regression/nex/floating_bus_test.nex      150
tilemap-demo      next    test/00regression/nex/tilemap_demo.nex           150
contention-test   48k     test/00regression/nex/contention_test.nex        250
layer2-320x256    next    test/00regression/nex/layer2_320x256_test.nex    150
layer2-640x256    next    test/00regression/nex/layer2_640x256_test.nex    150
sprite-scaling    next    test/00regression/nex/sprite_scaling_test.nex    150
sprite-anchor     next    test/00regression/nex/sprite_anchor_test.nex    150

# End-to-end demo regressions for the per-scanline / coordinate-space
# fix series (Tasks 1+13, 2026-05-01). 100-frame delay ≈ 2 s on the
# 50 Hz NEXT timing — past the demos' init phase, into steady-state
# animation. Reference captures pinned 2026-05-01.
beast-demo        next    test/00regression/nex/beast.nex                  100
parallax-demo     next    test/00regression/nex/parallax.nex               100

# TAP loading tests (need longer delay: 100-frame boot + auto-type + load)
tap-demo          48k     test/00regression/tap/beeper_demo.tap         300

# Screenshot tests for magic features (visual output on screen)
magic-bp-demo     next    test/00regression/nex/magic_bp_demo.nex          150
magic-port-demo   next    test/00regression/nex/magic_port_demo.nex        150

# David Crespo's nexlib tests (pre-built NEX files)
dapr-l2empty      next    test/00regression/nex/test01l2empty.nex       150
dapr-layer2       next    test/00regression/nex/test02layer2.nex        150
dapr-sprite       next    test/00regression/nex/test03sprite.nex        150
dapr-tilemap_00   next    test/00regression/nex/test04tilemap.nex       200  --delayed-keypress 2 0
dapr-tilemap_01   next    test/00regression/nex/test04tilemap.nex       200  --delayed-keypress 2 1
dapr-tilemap_02   next    test/00regression/nex/test04tilemap.nex       200  --delayed-keypress 2 2
dapr-print        next    test/00regression/nex/test05print.nex         150
# Interactive tests (moved to test/interactive/, require user input)
# dapr-keyb, dapr-joystick, dapr-covox, dapr-videoint
dapr-tilemapper_00 next   test/00regression/nex/test10tilemapper.nex    200  --delayed-keypress 2 0
dapr-tilemapper_01 next   test/00regression/nex/test10tilemapper.nex    200  --delayed-keypress 2 1
