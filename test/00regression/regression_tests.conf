# --delayed-screenshot-layers (Task 22b, 2026-07-12). beast.nex is the one
# demo that drives all four layers at once at frame 100 — ULA sky gradient +
# moon, tilemap clouds/mountains, Layer 2 trees/grass, sprite beast + rocks —
# so a single-layer capture of each is a discriminative test of the mask. Any
# leakage between layers, or any layer that stops being suppressible, moves
# pixels here. The four references are, by construction, disjoint slices of
# the beast-demo reference above (same frame, same emulator state); nothing
# but the compositor's layer selection differs.
layers-beast-ula     next  test/00regression/nex/beast.nex  100  --delayed-screenshot-layers ula
layers-beast-l2      next  test/00regression/nex/beast.nex  100  --delayed-screenshot-layers layer2
