copper-demo       next    test/00regression/nex/copper_demo.nex            150
floating-bus      48k     test/00regression/nex/floating_bus_test.nex      150
tilemap-demo      next    test/00regression/nex/tilemap_demo.nex           150
contention-test   48k     test/00regression/nex/contention_test.nex        250
layer2-320x256    next    test/00regression/nex/layer2_320x256_test.nex    150
layer2-640x256    next    test/00regression/nex/layer2_640x256_test.nex    150
sprite-scaling    next    test/00regression/nex/sprite_scaling_test.nex    150
sprite-anchor     next    test/00regression/nex/sprite_anchor_test.nex    150

# End-to-end demo regressions for the per-scanline / coordinate-space
# fix series (Tasks 1+13, 2026-05-01). 100-frame delay ≈ 2 s on the
# 50 Hz NEXT timing — past the demos' init phase, into steady-state
# animation. Reference captures pinned 2026-05-01.
beast-demo        next    test/00regression/nex/beast.nex                  100
parallax-demo     next    test/00regression/nex/parallax.nex               100

# --delayed-screenshot-layers (Task 22b, 2026-07-12). beast.nex is the one
# demo that drives all four layers at once at frame 100 — ULA sky gradient +
# moon, tilemap clouds/mountains, Layer 2 trees/grass, sprite beast + rocks —
# so a single-layer capture of each is a discriminative test of the mask. Any
# leakage between layers, or any layer that stops being suppressible, moves
# pixels here. The four references are, by construction, disjoint slices of
# the beast-demo reference above (same frame, same emulator state); nothing
# but the compositor's layer selection differs.
layers-beast-ula     next  test/00regression/nex/beast.nex  100  --delayed-screenshot-layers ula
layers-beast-l2      next  test/00regression/nex/beast.nex  100  --delayed-screenshot-layers layer2
layers-beast-sprites next  test/00regression/nex/beast.nex  100  --delayed-screenshot-layers sprites
layers-beast-tiles   next  test/00regression/nex/beast.nex  100  --delayed-screenshot-layers tiles

# ULA stencil mode (NR 0x68 bit 0) — Task 22b review follow-up, 2026-07-12.
# NO other committed NEX drives stencil mode (verified: zero NR 0x68 bit-0
# writes across all 26), so the compositor's stencil AND-branch had no
# screenshot coverage at all. stencil_test.nex is the minimal fixture:
# bright ULA stripes under a red-tile checkerboard, stencil on, NR 0x4A
# forced to black so a dropped layer is unmistakable.
#
# VHDL zxnext.vhd:7130 takes the AND-branch only when ula_en AND tm_en are
# BOTH set, and stencil_rgb is transparent whenever either input is (7112).
# So masking either layer must fall through to the ordinary ulatm merge
# (7134-7135) and show the survivor. stencil-layers-tiles is the
# discriminative row: with the ula_en half of that gate missing, the tile
# was erased into the black fallback (whole frame black) instead of being
# shown. stencil-demo and stencil-layers-ula are the controls — both are
# byte-identical with and without the bug.
stencil-demo         next  test/00regression/nex/stencil_test.nex  100
stencil-layers-tiles next  test/00regression/nex/stencil_test.nex  100  --delayed-screenshot-layers tiles
stencil-layers-ula   next  test/00regression/nex/stencil_test.nex  100  --delayed-screenshot-layers ula

# TAP loading tests.
#
# Task 19 (instant TAP load): the phantom typist (FUSE-style auto-typer)
# now triggers LOAD"" as soon as the BASIC ROM is ready for input —
# typically ~120 frames after boot on 48K (vs. the pre-Task-19 100-frame
# fixed delay before BASIC even started typing). The 300-frame
# screenshot delay below is still comfortably in the steady-state
# "BEEPER DEMO / SIMPLE MELODIE / PRESS S OR HOLD" screen.
tap-demo          48k     test/00regression/tap/beeper_demo.tap         300
# Task 19: also exercise the 128K MENU mode (default menu entry =
# Tape Loader → runs LOAD"" → fast-load trap consumes the TAP).
tap-demo-128k     128k    test/00regression/tap/beeper_demo.tap         500
# Task 19: also exercise the +3 ENTER mode (default = Loader → 48K
# BASIC + LOAD""). The +3 takes longer because the menu sits on a
# disk-probe pause before accepting ENTER.
tap-demo-plus3    plus3   test/00regression/tap/beeper_demo.tap         700
# Task 20: Next-mode --load TAP must populate SRAM pages 2..7 with the
# 48K BASIC fallback ROM, otherwise any 128K-class game that selects
# ROM 1 via port 0x7FFD bit 4 reads 0xFF for every ROM byte
# (including the canonical char set at $3D00). Symptom in real games
# (Cesare/RAGE1): cells painted with the SP1 default tile (' ') come
# out as solid bright cyan/white blocks. The rom_charset_test demo
# explicitly does `out (0x7FFD), 0x10` then plots the ROM char set
# 0..127 at top of screen — without the fix the Z80 jumps into 0xFF
# (= RST $38 chain) and crashes; with the fix the canonical
# Spectrum font renders.
tap-rom-charset-next next   test/00regression/tap/rom_charset_test.tap   400

