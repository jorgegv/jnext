dapr-tilemapper_00 next   test/00regression/nex/test10tilemapper.nex    200  --delayed-keypress-frames 100 0
dapr-tilemapper_01 next   test/00regression/nex/test10tilemapper.nex    200  --delayed-keypress-frames 100 1
# Interactive tests (moved to test/interactive/, require user input)
# dapr-isometric, dapr-mathfunc

# Game smoke tests — synthetic keypresses drive the title screen past
# its splash/menu so the screenshot captures a post-intro frame.
# --esxdos-stub: many z88dk-built NEX games call RST $08 (esxdos) at
# startup to load save state; jnext doesn't have NextZXOS-loaded esxdos
# under --load, so the shim returns benign errors and unblocks boot.
celeste           next    test/00regression/nex/celeste.nex             150  --esxdos-stub --delayed-keypress-frames 100 z
celeste2          next    test/00regression/nex/celeste2.nex            150  --esxdos-stub --delayed-keypress-frames 100 z
beanbros          next    test/00regression/nex/beanbros.nex            250  --esxdos-stub --delayed-keypress-frames 50 ENTER --delayed-keypress-frames 100 ENTER --delayed-keypress-frames 150 ENTER
shift             next    test/00regression/nex/shift.nex               150  --delayed-keypress-frames 50 SPACE --delayed-keypress-frames 100 SPACE
trainyard         next    test/00regression/nex/trainyard-express.nex   400  --esxdos-stub
santaspressie     next    test/00regression/nex/santaspressie.nex       400  --delayed-keypress-frames 250 ENTER
# odemo: exercises the Layer 2 320×256 bank-stride +16 fix (NR $12 = 14).
# Pre-fix: right half rendered as animated noise. Post-fix: clean credits.
odemo             next    test/00regression/nex/odemo.nex               700  --delayed-keypress-frames 50 SPACE --delayed-keypress-frames 250 SPACE --delayed-keypress-frames 350 SPACE --delayed-keypress-frames 450 SPACE --delayed-keypress-frames 550 SPACE
