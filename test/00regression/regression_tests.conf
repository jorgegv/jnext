# Task 20: Next-mode --load TAP must populate SRAM pages 2..7 with the
# 48K BASIC fallback ROM, otherwise any 128K-class game that selects
# ROM 1 via port 0x7FFD bit 4 reads 0xFF for every ROM byte
# (including the canonical char set at $3D00). Symptom in real games
# (Cesare/RAGE1): cells painted with the SP1 default tile (' ') come
# out as solid bright cyan/white blocks. The rom_charset_test demo
# explicitly does `out (0x7FFD), 0x10` then plots the ROM char set
# 0..127 at top of screen — without the fix the Z80 jumps into 0xFF
# (= RST $38 chain) and crashes; with the fix the canonical
# Spectrum font renders.
tap-rom-charset-next next   test/00regression/tap/rom_charset_test.tap   400

# Task 55 (2026-07-14): multicolour-engine demo regressions for the Task 54
# contention-stretch fix (contention pattern had the wrong PERIOD — the 8-T
# table repeated every 4 T — plus parity-blind mux fetch instants). These
# engines race the beam via contention-timed attribute rewrites, so any
# contention drift shifts the per-scanline colour splits visibly.
# Every reference below was verified against real FUSE 48K before commit
# (colour-index comparison: FUSE normal intensity 0xC0 mapped to jnext's
# RGB333 normal 0xDB, then raw diff).
#
# bifrost-screen1: BIFROST* ENGINE demo, first screen (tile gallery +
# "PRESS ANY KEY"). Static except FLASH cells, which flip every 16 frames;
# frame 300 = flash phase A (floor(300/16)=18, even = non-inverted).
# FUSE match: exactly 0 pixels diff in phase A (248 px in phase B = the
# flash cells, as expected).
# The 48k machine pin is deliberate: BIFROST requires 48K timing. Under
# --machine next (NextZXOS tape-loads it in +3 timing) one column renders
# its attribute a scanline early — an equilibrium-selection effect, not a
# jnext bug (Task 59, G12-NIRVANA-STATUS-2026-07-13.md sect. 10).
bifrost-screen1   48k     test/00regression/tap/bifrost.tap             300
# bifrost-screen2: SPACE at frame 500 advances to the "Demonstrating
# static tiles" screen, fully drawn and stable by frame 900 (no FLASH
# cells; frames 900/950/1000 byte-identical). FUSE match: exactly 0 px.
bifrost-screen2   48k     test/00regression/tap/bifrost.tap             900  --delayed-keypress-frames 500 space
# nirvana / nirvanap: NIRVANA / NIRVANA+ ENGINE demos, continuously
# animated (sprites + randomized brick maze), so no FUSE frame-exact match
# is possible; headless jnext is frame-deterministic, so frame 500 (demo
# fully running, tape loaded via fast ROM trap) is a stable reference.
# FUSE verification: static text rows match exactly (0 px: NIRVANA title +
# (c)2013 credits, NIRVANA+ full-width banner), bricks YELLOW (nirvana) /
# WHITE (nirvanap) in both, full-frame colour-index sets identical (15
# colours each, same ranking; nirvana's static blue frame = 6472 px in both).
nirvana           48k     test/00regression/tap/nirvana.tap             500
nirvanap          48k     test/00regression/tap/nirvanap.tap            500
# Task 57 (2026-07-14, G36): real-time TZX loading end-to-end, including
# the DeciLoad 12k8 turbo loader's Direct Recording (0x15) blocks — the
# only committed fixture that exercises --tape-realtime at all. Locks
# BOTH G36 fixes: (1) Emulator::monotonic_tstates() — the tape clock
# must not reset with the per-frame FUSE counter (pre-fix the tape froze
# at the first frame boundary: whole run stays on a white screen);
# (2) the ZOT pause terminating-edge hold (pre-fix every block's final
# bit was swallowed → LD-BYTES checksum error → endless search loop).
# Frame 1300 = game fully loaded through blocks 0x11 + 0x15 + ZX0
# decompression, showing the Xevious control-select menu (verified
# byte-identical across independent runs; the loaded game screen is the
# genuine Probe Software menu — a single corrupted bit in the ZX0
# streams would crash the loader, not render this).
xevious-deciload  48k     test/tzx/Xevious_ZX0_DeciLoad12k8.tzx        1300  --tape-realtime
