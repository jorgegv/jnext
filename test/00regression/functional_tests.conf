# Declared functional tests run by regression.sh, one per line, in this order.
# Each test's logic lives in scripts/<name>.sh; the driver refuses to run if a
# declared test has no script or a stray script is not declared here.
#
# THIS FILE IS A CONTRACT, NOT A CONVENIENCE.
#
# regression.sh proves, at the end of every full run, that every test named here
# reported a row (PASS, FAIL or SKIP) and that no row appeared that is not named
# here. A mismatch in either direction is a LOUD FAILURE.
#
# It exists because rewind-func used to be gated on `[[ -x build/test/rewind_test ]]`
# and, when a `make clean` had deleted that binary, printed NO ROW AT ALL — not a
# skip, not a failure. The suite total silently went 57 -> 56 and the missing test
# was invisible (Task 35, 2026-07-12).
#
# The screenshot tests have their own manifest: regression_tests.conf.
# The assertion lint is always row 1 and is not listed here.
#
# TAGS (GH #295). Every row runs in a process of its own, with its own
# $TMP_DIR and $RUN_DIR (= $JNEXT_CONFIG_DIR), several rows at once. Words after
# a row's name say where it runs; an unknown word is refused:
#
#   (none)      the parallel phase, JNEXT_TEST_JOBS (default: every CPU) at a
#               time, booting the run's shared SD clone through a hard link;
#   quiet       the quiet phase, after the parallel one, JNEXT_TEST_QUIET_JOBS
#               (default 1) at a time: the row paces against REAL time and was
#               measured to fail under the parallel phase's load;
#   serial      alone, after everything else;
#   private-sd  on a copy of the card of its own: the row WRITES to the card.
#   os=<list>   (GH #319) the OSes whose run includes the row, a comma-separated
#               subset of linux,macos,windows. `linux` is MANDATORY (a Linux run
#               runs every row, so these tags never change `make regression`).
#               No tag = all three. `make regression-win` (MinGW exes under wine)
#               and `make regression-macos` run the rows that admit them and
#               PRINT the others by name as absent -- absence is declared here,
#               with a `# os:` reason on the line above the row, never a SKIP.
#
# The tags were set by measurement, not by guess: each row was run against a
# fingerprinted clone (only the two private-sd rows changed it), and the suite
# was run repeatedly in parallel, also under extra CPU load, with every row
# untagged that did not fail there. The evidence is in the GH #295 record. A
# row that writes to the shared clone WITHOUT the tag is caught at the end of
# every run (the clone is fingerprinted), never left to perturb another row.

# expect: 148
# expect-macos: 131
# expect-windows: 128
#   The number of rows each OS runs (148 minus the rows whose os= tag omits it),
#   pinned the same way: retagging a row without updating these is refused, in
#   both directions. Required as soon as any row carries an os= tag.
#   The number of functional tests declared below, pinned. regression.sh FAILS if the
#   count here and the rows below ever disagree. Without it, deleting a test
#   from this file just shrinks both sides of the completeness check together
#   and the suite reports a smaller number as a clean pass. (Review round 2
#   deleted one screenshot row + its reference image and got a green 59/0/0 --
#   this project's own previous baseline. Nobody would have blinked.)
#   Change this number only when you deliberately add or remove a test.

