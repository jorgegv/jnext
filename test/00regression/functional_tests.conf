# GH #319: failed twice under wine (CI quiet phase at load 1.08: "retries: 2, restarts: 8"; full runs at load 10-19: "restarts: 1"), never on Linux/macOS. CAUSE (GH #327): ThreadedEsp::tick
# dropped emulated time while the ESP worker held the core lock (under wine across Winsock send/recv, up to 382 018 cycles), so a framed reply paused mid-message and NextSync 1.2 dropped the
# packet; fixed by giving the guest-bound wire its own lock. The failure signatures were NOT a late reply (a late reply produces 32-313 restarts). The row stays on every OS and still prints its own
# diagnosis: the peer logs every RX/TX with wall-clock timestamps and parses the stream (glued commands no longer cascade), jnext runs with esp01=debug, and a failure prints the exchange around the first Retry/Restart from both sides.
