# Declarations for test/lint-ascii-text.sh, rule B (GH #382).
#
# Program text under src/ is ASCII because a Windows console shows UTF-8 bytes in its OEM
# code page. The only non-ASCII literals allowed are Qt widget texts that Qt draws and that
# are never written to a console, one declaration each:
#
#   path <TAB> the literal body exactly as written (escapes unexpanded, spaces
#   significant) <TAB> reason
#
# A declaration that matches no literal in its file fails the lint, so editing or removing
# the literal means editing or removing its line here. Rule A (no U+2014) has no exceptions
# and cannot be declared away.
