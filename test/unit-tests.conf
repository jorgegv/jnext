# Declared unit-test suites — the single source of truth for `make unit-test`.
#
# Format, one suite per line:   <executable> [args...]
#   @BUILD@ expands to the build directory (default: build).
#   Blank lines and #-comments are ignored.
#
# THIS FILE IS A CONTRACT, NOT A CONVENIENCE.
#
# test/run-unit-tests.sh refuses to run unless this list agrees EXACTLY with the
# suites CMake registered via add_test(). A suite registered in CMake but absent
# here — or named here but not registered, or named here but not built — is a
# LOUD FAILURE, never a silent omission.
#
# That guard exists because the list it replaces was hand-kept inside the
# Makefile and drifted: cpu_int_pulse_test and cpu_z80n_im2_regressions_test
# were compiled and add_test()'d for months, were never in the list, and so had
# never once run (Task 32, 2026-07-12). 63 passing assertions were missing from
# every headline count and nothing anywhere said so.

