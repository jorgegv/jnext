# Declared unit-test suites — the single source of truth for `make unit-test`.
#
# Format, one suite per line:   <executable> <expected_rows> [args...]
#   <expected_rows>  the exact `Total:` the suite must report. A suite that
#                    reports any other number FAILS — including a LOWER one.
#   @BUILD@          expands to the build directory (default: build).
#   ?<executable>    optional: mandatory if CMake registered it, loudly skipped
#                    if it did not (debugger_* suites exist solely under
#                    -DENABLE_DEBUGGER=ON; app_config_test solely under
#                    -DENABLE_QT_UI=ON).
#   Blank lines and #-comments are ignored. Duplicate entries are rejected.
#
# THIS FILE IS A CONTRACT, NOT A CONVENIENCE.
#
# test/run-unit-tests.sh refuses to run unless this list agrees EXACTLY with the
# suites CMake registered via add_test(). A suite registered in CMake but absent
# here — or named here but not registered, or named here but not built — is a
# LOUD FAILURE, never a silent omission. And a suite that runs but reports the
# wrong number of rows is a FAILURE too: the counts below are what makes a
# shrinking suite impossible to hide.
#
# When you add or remove a test row, update the count here. That edit IS the
# point: the number in this file is the project's claim about how much it tests,
# and it must be made deliberately.
#
# Why all this exists — three suites vanished from the counts in one day, each
# found by accident (2026-07-12):
#   Task 32  cpu_int_pulse_test + cpu_z80n_im2_regressions_test were compiled and
#            add_test()'d for months, were absent from the hand-kept list inside
#            the Makefile, and had NEVER RUN. 63 passing assertions, uncounted.
#   Task 35  `make clean` deleted build/test/rewind_test and the regression suite
#            printed no row at all — not a skip. Total silently 57 -> 56.
#   Task 37  a worktree without roms/ made sd_rom_extractor_test report 8 rows
#            when it has 26. 18 rows ceased to exist; the run still looked green.
#
# A green triplet is only as trustworthy as its denominator.

# expect: 63
#   The number of suites declared below, pinned.
#   Without it, the manifest-vs-CMake cross-check is a TAUTOLOGY against the one
#   edit that matters most: delete a suite's add_test() from test/CMakeLists.txt AND
#   its row here, and both sides shrink together — 45 declared, 45 registered, all
#   agreeing, exit 0, three test rows gone. (Review round 3 did exactly that with
#   log_gate_test and got a clean green run.) This pin is the outside witness.
#   Change it only when you deliberately add or remove a SUITE.

