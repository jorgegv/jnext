# Traceability matrix — exceptions file (GH #196 phase 2.2)
#
# The ONE hand-maintained input to doc/testing/TRACEABILITY-MATRIX.md. Every
# other cell of that document is computed from a test source or a plan doc;
# this file exists for the rows those two cannot honestly answer for.
#
# SYNTAX — one record per line, exactly three fields separated by `|`:
#
#     <section> | <id> | <text>
#
#   section  the `##` section header text, up to but not including the em-dash
#            (e.g. `Rewind`). Must match a section the generator emits.
#   id       the row ID, in the same shape the test sources use.
#   text     the row's description.
#
# Blank lines and lines whose first non-space character is `#` are ignored.
# Anything else is a REFUSAL (exit 2): a malformed exceptions file must stop
# the run rather than silently drop a row, which is the failure mode the whole
# issue exists to remove. A duplicate (section, id) is a refusal too.
#
# WHAT BELONGS HERE: planned-but-unimplemented rows of a suite that has NO
# plan doc. Two suites are in that position — `rewind_test` and `sdcard_test`
# are tombstoned (`(jnext-internal)` and `(SD SPI spec)`: no VHDL counterpart
# to derive a plan from), so there is no `*-TEST-PLAN-DESIGN.md` to record a
# planned row in, and without this file the backlog would simply vanish when
# the matrix became generated.
#
# WHAT DOES NOT: a row a plan doc can carry (put it in the plan doc), or a row
# a test asserts (the generator finds it by itself). This file is not a place
# to assert coverage — every row here emits as `missing`, because nothing runs
# it.

# Rewind — none. GH #201: all 21 rows this file used to carry named an
# assertion rewind_test ALREADY made through its anonymous CHECK macro, so
# the backlog was a bookkeeping artefact of the missing ID literals, not a
# coverage gap. The IDs are spelled out at the call sites now and the
# generator finds them by itself, which is what the rule two paragraphs up
# says must happen — a row a test asserts does not belong here.

# SD Card — none. The suite is still tombstoned (no plan doc, no VHDL
# counterpart), but both rows this file used to carry for it are gone.
#
# MMC-03 (byte-vs-block addressing duality) was implemented by GH #94 and is
# now an asserted row in test/sdcard/sdcard_test.cpp; a planned ID and an
# asserted ID may not coexist, so its line is gone rather than commented.
#
# MMC-02 (CMD8 illegal-cmd response on MMC not modelled) — WONT 2026-09-24
# (GH #201, owner decision). jnext mounts SD-card images: every image it
# provisions is an SD card, and no software it runs probes for an MMC.
# SdCardDevice models ONE card that answers both CMD1 (the legacy-MMC init
# path, live as MMC-01) and CMD8 with an SD v2 R7; a real card is one or the
# other, so the row needs a selectable card TYPE, not an extra branch. Making
# the type selectable reaches a CLI flag, the cli_options table, the man page,
# the GUI, save-state and a regression row — and anything short of that is a
# test-only mode no production path can reach, which is the "add a hook so the
# row goes green" move doc/testing/UNIT-TEST-PLAN-EXECUTION.md §8 exists to
# prevent. The gap's own filing agrees it is not worth it: G41, effort L,
# impact "raw-MMC software (rare) won't init", likelihood L, priority Low.
# G41 itself stays exactly as it is in
# doc/issues/KNOWN-FUNCTIONALITY-GAPS-AND-PLAN.md, which is a frozen
# historical document and was not touched.

# Historical note: RW-RT-01..03 were added here (Phase 2.2 review) as the only
# trace of three real rewind assertions whose original RT-01..03 names collided
# with `host_key_latch_test`. They are asserted under those names in
# rewind_test now, so the trace is in the source where it belongs.
