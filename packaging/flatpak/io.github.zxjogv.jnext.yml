app-id: io.github.zxjogv.jnext
# KDE runtime chosen over org.freedesktop.Platform because jnext's Qt6 GUI
# (ENABLE_QT_UI=ON, ENABLE_DEBUGGER=ON) needs Qt6::Widgets; the KDE runtime
# ships a full Qt6 stack out of the box, so it doesn't need to be built as
# a separate module. Since GH #57 the same is true of SDL3 (see the note in
# `modules:` below), so this manifest builds nothing from source at all.
# 6.10 is the newest KDE runtime the CI
# flatpak-builder image (ghcr…:kde-6.10) provides; 6.8 is deprecated on flathub
# and kde-6.11 has no CI image yet. Bump both this and the CI image together.
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: jnext

finish-args:
  - --share=ipc
  # GH #271. jnext is a NETWORKED application and this manifest never said so,
  # which left the sandbox with no network namespace and therefore no DNS at
  # all. Two shipped features need it:
  #   * the SD-card provisioner downloads the NextZXOS distro zip over HTTPS
  #     (src/core/sdcard_provisioner_net_curl.cpp) — without it a first run has
  #     no ROMs and dies with libcurl's "Could not resolve hostname", which is
  #     exactly what was reported;
  #   * the ESP-01 WiFi emulation (GH #25) opens real TCP/UDP sockets and
  #     listens for inbound connections (src/esp01/src/esp_socket_posix.cpp),
  #     so a guest program can reach a real BBS such as nx.nxtel.org. That half
  #     was broken too and simply nobody had tried it inside a Flatpak.
  # Do not drop this line: packaging/flatpak/verify-permissions.sh asserts it
  # on the BUILT bundle (run by `make package-flatpak` and by the release
  # workflow's flatpak job), so losing it fails the build rather than the user.
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home

modules:
  # NOTE (GH #57): an `sdl2` module used to be built from source here, with a
  # pinned tarball + sha256, because SDL2 was not part of the KDE runtime.
  # SDL3 IS: org.kde.Platform//6.10 ships libSDL3.so.0 and org.kde.Sdk//6.10
  # ships the headers, the CMake package and sdl3.pc. So the module was
  # DELETED rather than re-pinned, and with it a recurring
  # bump-the-tarball-and-its-hash maintenance item. If the runtime version
  # below is ever moved to one without SDL3, this module has to come back.
  - name: jnext
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_QT_UI=ON
      - -DENABLE_TESTS=OFF
      # LTO OFF for Flatpak ONLY: the org.kde.Sdk GCC miscompiles the
      # QApplication init under whole-program LTO (SIGSEGV at GUI launch).
      # Bisected to the LTO process in that toolchain, not any single unit.
      # Native/DEB/RPM/gui-release builds keep full LTO. See CMakeLists.txt.
      - -DJNEXT_ENABLE_LTO=OFF
    sources:
      # Build from the LOCAL checkout, not a pushed remote tag. This project
      # bumps the version locally and pushes tags in batches, so the current
      # tag is frequently NOT yet on origin; a `type: git` + remote `tag:`
      # source therefore breaks `make package-flatpak` locally with
      # "unknown revision". `path` points flatpak-builder at this repo's
      # working tree (relative to the manifest dir packaging/flatpak/ → repo
      # root) and it clones the checked-out HEAD. Because it is still a
      # `type: git` source, flatpak-builder also mirrors the spdlog submodule
      # during the network-enabled source phase, so CMakeLists.txt's
      # `git submodule update` is a no-op inside the network-less build
      # sandbox. In CI, actions/checkout leaves the release tag checked out,
      # so this same mechanism builds exactly that tag — equivalent provenance,
      # no dependency on the tag having been pushed.
      - type: git
        path: ../..
        # `branch: HEAD` builds whatever this checkout currently has checked
        # out — a branch tip locally, the detached release tag in CI — so the
        # same manifest is portable across both without a hard-coded ref (the
        # git source otherwise defaults to `master`, which this repo lacks).
        branch: HEAD
    # No post-install needed: CMakeLists.txt's own install() rules (Task 67)
    # already place the .desktop/metainfo/icon files under the standard
    # freedesktop paths, which cmake-ninja installs to $FLATPAK_DEST (/app)
    # the same as any other `ninja install` target.
