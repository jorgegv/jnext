name: Release

# Task 69. Publishes a GitHub Release with downloadable packages whenever a
# `v*` tag is pushed.
#
# This workflow does NOT rebuild anything — the "Packaging" workflow
# (.github/workflows/packaging.yml, Task 67) already triggers on the same
# `v*` tag push and builds+uploads the Linux (.deb/.rpm/.tar.gz), Windows
# (.zip) and macOS (.dmg) artifacts via CPack. Duplicating those build
# steps here would mean two independent builds of the same tag with two
# chances to disagree. Instead this workflow waits for that workflow to
# finish, downloads ITS artifacts by run id, and turns them into a Release.
#
# Ownership note: packaging.yml and packaging/ belong to a sibling task and
# are referenced, not modified, here.
#
# CAVEAT — unverifiable locally: this repo has no local GitHub Actions
# runner, so the workflow_run hand-off below (and the Windows/macOS legs it
# depends on, which packaging.yml's own header already marks UNTESTED on
# this dev host) cannot be exercised end-to-end outside GitHub. The YAML is
# validated for syntax; its runtime behaviour is not.

on:
  workflow_run:
    workflows: ["Packaging"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    # Only publish when the triggering Packaging run itself succeeded, and
    # only for the tag-push trigger (head_branch is the tag name in that
    # case) — not for an ad-hoc `workflow_dispatch` run of Packaging on an
    # arbitrary branch, which must never produce a public Release.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux packages (.deb/.rpm/.tar.gz)
        uses: actions/download-artifact@v4
        with:
          name: jnext-linux-packages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      # Windows/macOS jobs in packaging.yml are marked UNTESTED (no runner
      # available on the dev host that wrote them). Downloaded best-effort
      # so a Release still publishes with just the Linux packages if either
      # leg fails or its artifact is absent.
      - name: Download Windows package (best-effort)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: jnext-windows-package
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - name: Download macOS package (best-effort)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: jnext-macos-package
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          files: dist/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
