name: Release

# Tag-triggered build + gated publish. One workflow: a `v*` tag push runs the
# `gate` job, which reads releases.yaml FROM THE TAG'S OWN COMMIT and decides
# whether this tag is a public release. If it is, the per-OS build jobs run and
# the `publish` job attaches their packages to a GitHub Release. If the tag is
# not in releases.yaml, nothing builds — it stays a private history tag.
#
# See doc/RELEASE-PROTOCOL.md. This replaces the old packaging.yml + release.yml
# workflow_run hand-off (a single workflow avoids that fragility).
#
# EVERY build step here is a plain `make` target — the same one a developer
# types locally (CLAUDE.md, "CI runs the EXACT same commands as a local run").
# Nothing in this file open-codes cmake/cpack; if a job needs a capability, it
# is added to the Makefile so local runs get it too. The ONE declared exception
# is the flatpak build, which lives in the shared
# .github/workflows/flatpak-build.yml (see its header).
#
#   * deb     → `make package-deb` in pinned ubuntu:24.04 AND ubuntu:26.04
#               containers (matrix). shlibdeps bakes in the container's library
#               package names, so each LTS gets its own per-release-named deb
#               (the 24.04 t64 names are unsatisfiable on 26.04, hence two debs).
#   * rpm     → `make package-rpm` in a fedora:44 container (Fedora-native deps —
#               building the RPM on Ubuntu bakes in an incompatible libcurl node)
#   * src     → `make package-src` → jnext-<ver>-src.zip (submodule-aware)
#   * windows → `make package-win` + `package-win-qt5` + `package-win32-qt5`
#               (MinGW cross-build + DLL bundling) in a fedora:44 container —
#               the three published Windows zips (exe runs under wine)
#   * flatpak → delegated to the shared .github/workflows/flatpak-build.yml
#               (also dispatchable by hand); flatpak-builder against
#               org.kde.Sdk//6.10, the same manifest + runtime as a local
#               `make package-flatpak`
#   * macos   → `make package-macos` native on macos-latest (proven green on a
#               real runner in v0.98.34). No longer continue-on-error since
#               issue #61: it carries the GH #46 verify-bundle gate, and a gate
#               that cannot fail anything is not a gate. `publish` requires
#               success(), so a failed .dmg withholds the release.
#
# workflow_dispatch builds all packages for testing but never publishes.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---- decide whether this tag is a public release ------------------------
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v5   # checks out the tag's own commit on a tag push
      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true"    >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::workflow_dispatch — building packages for testing, not publishing a release"
            exit 0
          fi
          tag="${GITHUB_REF_NAME}"
          esc=$(printf '%s' "$tag" | sed 's/[.]/\\./g')   # treat dots literally
          if grep -qE "^[[:space:]]*-[[:space:]]*${esc}[[:space:]]*$" releases.yaml; then
            echo "build=true"   >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} is listed in releases.yaml — building + publishing a GitHub Release"
          else
            echo "build=false"   >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} is not in releases.yaml — private tag, nothing built"
          fi

  # ---- Linux DEB: CPack DEB in pinned Ubuntu containers (matrix) -----------
  # DEB only. The .deb's dependency autodetection (CPACK_DEBIAN_PACKAGE_SHLIBDEPS)
  # runs dpkg-shlibdeps, which bakes in the LIBRARY PACKAGE NAMES of the Ubuntu
  # it runs on. ubuntu-latest (24.04) produces the t64-transition names
  # (libcurl4t64, libpng16-16t64, libssl3t64, libqt6core6t64/gui6t64/widgets6t64);
  # Ubuntu 26.04 renamed/bumped several of them, so a single
  # 24.04-built deb is UNINSTALLABLE on 26. Fix: build one deb PER supported LTS
  # in its own PINNED container (mirrors the `rpm` job's fedora:44 container),
  # rename each with its Ubuntu release, and ship both. The RPM is built in a
  # separate Fedora-container job (see `rpm` below) so ITS deps are Fedora-native
  # — building the RPM on Ubuntu bakes in Ubuntu's libcurl symbol node
  # (libcurl.so.4(CURL_OPENSSL_4)) which Fedora does not provide. The TGZ tarball
  # was dropped (deb+rpm cover Linux; user decision).
  deb:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rel: ["24.04", "26.04"]
    container: ubuntu:${{ matrix.rel }}
    steps:
      # Install deps FIRST (git is needed for actions/checkout's submodule
      # fetch; dpkg-dev+file are needed by dpkg-shlibdeps inside a bare
      # container — the ubuntu-latest runner had them preinstalled).
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cmake make g++ git file dpkg-dev curl ca-certificates \
            zlib1g-dev libcurl4-openssl-dev libssl-dev libpng-dev \
            qt6-base-dev
          # SDL3 (GH #57). Ubuntu 24.04 LTS has no libsdl3 at ANY version, and
          # neither does 24.10 — it first appears in 25.04. That one series
          # therefore installs nothing here: `make package-deb` depends on the
          # `sdl3-vendor` target, which builds SDL3 from a pinned, checksummed
          # source tarball and links it statically (packaging/build-sdl3.sh
          # explains why static rather than bundled-shared). On every other
          # series that target is a no-op and the distro package is used, so
          # the make command below is identical on both legs — which is the
          # rule: CI runs the exact same plain make target a developer types.
          if [ "${{ matrix.rel }}" = "24.04" ]; then
            # SDL3's own build dependencies. This list was not guessed: it is
            # what an actual ubuntu:24.04 container needed to configure SDL
            # 3.4.16, arrived at by running the build until it stopped naming a
            # missing package (libxss-dev and libxtst-dev were the two a reading
            # of SDL's docs missed). SDL hard-fails on a missing sub-feature of
            # an ENABLED subsystem, so an incomplete list breaks the release
            # loudly rather than quietly shipping a crippled SDL.
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
              libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
              libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
              libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev \
              libegl-dev libgl-dev libgles-dev libibus-1.0-dev \
              libsamplerate0-dev libpipewire-0.3-dev
          else
            DEBIAN_FRONTEND=noninteractive apt-get install -y libsdl3-dev
          fi
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # The project's own target, byte-for-byte the command a developer runs
      # locally (CLAUDE.md: CI runs the EXACT same commands as a local run).
      # It configures + builds build/deb-release and runs cpack -G DEB there.
      - name: make package-deb
        run: make package-deb
      # CPack emits jnext_<ver>_amd64.deb; tag it with the Ubuntu release so the
      # two matrix legs' artifacts don't collide (version derived, not hardcoded).
      - name: Rename deb per Ubuntu release
        working-directory: build/deb-release
        run: |
          src=$(ls -1 jnext_*_amd64.deb | head -1)
          dst="${src%_amd64.deb}_ubuntu${{ matrix.rel }}_amd64.deb"
          mv "$src" "$dst"
          echo "Renamed $src -> $dst"
      - uses: actions/upload-artifact@v6
        with:
          name: jnext-deb-${{ matrix.rel }}
          path: |
            build/deb-release/jnext_*_ubuntu*_amd64.deb

  # ---- Linux RPM: CPack RPM in a Fedora container (Fedora-native deps) -----
  # Mirrors the `windows` job's pattern: ubuntu-latest runner + fedora:44
  # container. Building the RPM on genuine Fedora makes CPack's RPM
  # auto-dependency generator resolve Fedora-native provides — the .rpm requires
  # `libcurl.so.4()(64bit)` (which Fedora provides) instead of the Ubuntu-baked
  # `libcurl.so.4(CURL_OPENSSL_4)(64bit)` (which Fedora does NOT provide, so
  # `dnf install` failed with "nothing provides ..."). PROVEN root cause.
  rpm:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y \
            cmake make gcc-c++ git \
            SDL3-devel libcurl-devel openssl-devel zlib-devel libpng-devel \
            qt6-qtbase-devel rpm-build
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      # The project's own target, byte-for-byte the command a developer runs
      # locally (CLAUDE.md: CI runs the EXACT same commands as a local run).
      # It configures + builds build/rpm-release and runs cpack -G RPM there.
      - name: make package-rpm
        run: make package-rpm
      - uses: actions/upload-artifact@v6
        with:
          name: jnext-linux-rpm
          path: |
            build/rpm-release/*.rpm

  # ---- Source: submodule-aware jnext-<ver>-src.zip ------------------------
  # `make package-src` runs packaging/make-dist-tarball.sh, which vendors the
  # git-submodule content (a naive `git archive` drops it) and emits the
  # jnext-<ver>-src.zip that `publish` attaches. The version comes from
  # version.yaml (single source of truth).
  src:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make git zip
      - name: Build source zip
        run: make package-src
      - uses: actions/upload-artifact@v6
        with:
          name: jnext-source-zip
          path: |
            build/dist/jnext-*-src.zip

  # ---- Windows: make package-win in a Fedora container --------------------
  # The SAME path as a local `make package-win` — a MinGW cross-build in a
  # Fedora container (Ubuntu/Debian do not package MinGW-Qt6; only Fedora does).
  # The zip bundles the Qt6/SDL3 runtime DLLs + qwindows plugin via
  # packaging/windows/bundle-dlls.sh. Pinned to fedora:44 to match the verified
  # dev host. Proven in a fedora:44 docker container; the exe runs under wine.
  windows:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      # git is needed for actions/checkout's submodule fetch; the rest is the
      # MinGW cross toolchain + host Qt6 tools (moc/rcc/uic from qt6-qtbase-devel)
      # that make package-win needs. mingw64-cmake ships in mingw64-filesystem.
      # The mingw64-qt5-* trio backs make package-win-qt5 (GH #108 Phase A:
      # the Qt5 full-GUI Win7/8 legacy zip): qtbase carries the Qt5 DLLs +
      # Qt5Config.cmake + libqt5main.a, qmake carries the cross moc/rcc/uic
      # AUTOMOC needs. The mingw32-* set is the i686 twin backing
      # make package-win32-qt5 (GH #108 Phase C: the 32-bit Qt5 zip).
      - name: Install MinGW cross toolchain + build tools
        run: |
          dnf install -y \
            make git findutils gawk grep coreutils diffutils zip \
            mingw64-gcc mingw64-gcc-c++ mingw64-binutils mingw64-filesystem \
            mingw64-qt6-qtbase mingw64-SDL3 \
            mingw64-qt5-qtbase mingw64-qt5-qtbase-devel mingw64-qt5-qmake \
            mingw64-zlib mingw64-libpng mingw64-winpthreads \
            mingw32-gcc mingw32-gcc-c++ mingw32-binutils mingw32-filesystem \
            mingw32-SDL3 \
            mingw32-qt5-qtbase mingw32-qt5-qtbase-devel mingw32-qt5-qmake \
            mingw32-zlib mingw32-libpng mingw32-winpthreads \
            qt6-qtbase-devel
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: make package-win
        run: make package-win
      # Qt5 full-GUI Win7/8 legacy variant (GH #108 Phase A) — same container,
      # same plain make target a local run uses. The SDL-only variants (x64 AND
      # the i686 twin package-win32-sdl) are repo-internal validation legs
      # (owner decision 2026-07-26): exercised by ci.yml's package job via
      # `make package-test`, never built or published here. Final published
      # lineup: x64-Qt6, x64-Qt5, i686-Qt5.
      - name: make package-win-qt5
        run: make package-win-qt5
      # 32-bit Qt5 leg (GH #108 Phase C) — the third and last published
      # Windows artifact: jnext-<ver>-windows-x86-legacy.zip (Win7 SP1+, 32-bit).
      - name: make package-win32-qt5
        run: make package-win32-qt5
      - uses: actions/upload-artifact@v6
        with:
          name: jnext-windows-package
          path: |
            build/win-release/*.zip
            build/win-qt5-release/*.zip
            build/win32-qt5-release/*.zip

  # ---- Flatpak: delegated to the shared definition -------------------------
  # The steps live in .github/workflows/flatpak-build.yml, which this job calls,
  # ci.yml's flatpak job also calls, and which can ALSO be dispatched by hand.
  # One definition, three entry points. Before, the gate had never run on a
  # runner — every artifact job here is skipped for a private tag — and there
  # was no way to exercise it short of cutting a public release. A manual run
  # now exercises THIS job's steps rather than a copy of them.
  #
  # That file also carries the project's ONE declared exception to "every CI
  # step is a plain make target" (it builds through the upstream
  # flatpak-builder action rather than `make package-flatpak`) and the GH #271
  # permission gate. Read its header for both.
  #
  # What stays here, because it is release-specific: this job is gated on
  # `gate`, so a private tag builds nothing, and it is BLOCKING.
  #
  # BLOCKING, as of v0.99.110. This job carried continue-on-error while it had
  # never run on a GitHub runner, with its own comment setting the exit
  # condition: "tighten back to blocking after the first green run". That run
  # happened — flatpak succeeded on the v0.99.110 release — so the condition is
  # met and the flag is gone.
  #
  # What it was actually doing: continue-on-error reports a FAILED job as
  # success to the `needs` context, so `publish` (which requires success() of
  # all seven) went ahead and attached whatever artifacts existed. A release
  # could therefore go out silently missing its flatpak bundle with nothing
  # anywhere red — the same fail-safe-but-fail-SILENT shape that was removed
  # from the macos job in issue #61, and for the same reason: a gate that
  # cannot fail anything is not a gate.
  #
  # Owner decision (2026-08-02): ANY packaging error blocks the release. Every
  # other artifact job here was already blocking; this was the last exception.
  # The accepted cost is the one #61 already accepted for macOS — a hiccup on
  # one platform holds up the others, because a release either covers the
  # platforms it claims or it stops and says so. To take a deliberately
  # partial release, restore continue-on-error here in that one commit, or drop
  # the job from publish's `needs:` — an explicit, visible decision each time.
  #
  # The bundle the called workflow uploads belongs to THIS run (a reusable
  # workflow's artifacts are the caller's), so `publish` downloads it unchanged.
  # `timeout-minutes` is not settable on a `uses:` job; the same 45-minute bound
  # now lives on the job inside flatpak-build.yml.
  flatpak:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    uses: ./.github/workflows/flatpak-build.yml

  # ---- macOS: native CPack DragNDrop --------------------------------------
  macos:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: macos-latest
    # NOT continue-on-error (issue #61). It was, which made the job fail-SAFE
    # but fail-SILENT: a bad .dmg was not shipped (verify-bundle fails -> no
    # upload), but nothing anywhere went red, so a release could quietly go out
    # with no macOS package and no one would notice. That is the GH #46 class
    # of defect — macOS problems failing nothing is precisely how a .dmg that
    # aborted in dyld reached users.
    #
    # The leniency was justified when this leg was unproven; it no longer is.
    # The macos job has run green on a real macos-latest runner (v0.98.34,
    # which published jnext-0.98.34-Darwin.dmg), and it now carries the #46
    # verify-bundle gate — a gate that cannot fail anything is not a gate.
    #
    # What that ENFORCES: this job's failure is now visible in the `needs`
    # context, and `publish` requires `success()` (see its comment), so a
    # failed .dmg stops the release instead of silently omitting a platform.
    # Cost, deliberately accepted: a macOS-side failure (a brew hiccup, an
    # Apple toolchain change) also holds up the Linux and Windows packages.
    # That is the intended trade — a release either covers the platforms it
    # claims or it stops and says so. To take a Linux+Windows-only release out
    # on purpose, restore `continue-on-error: true` here in that one commit, or
    # drop `macos` from publish's `needs:` — an explicit, visible decision each
    # time, not a standing one.
    #
    # UNVERIFIED HERE: no Mac and no Actions runner on the dev host. The
    # recommended confirmation is one `workflow_dispatch` dry run with this job
    # deliberately broken (e.g. a bad `brew install` package name), checking
    # that `publish` is skipped and that a red `flatpak` alone still publishes.
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install dependencies (Homebrew)
        run: brew install cmake sdl3 qt@6 curl openssl libpng
      # The project's own target, same as a local Mac build: configure, build,
      # package, then mount the .dmg and assert with otool that nothing inside
      # it references Homebrew (GH #46 — the v0.98.34 .dmg did, and aborted in
      # dyld on every Mac but the builder's).
      - name: Package and verify (make package-macos)
        timeout-minutes: 30
        run: CMAKE_PREFIX_PATH="$(brew --prefix qt@6)" make package-macos
      - uses: actions/upload-artifact@v6
        with:
          name: jnext-macos-package
          path: build/mac-release/*.dmg
          if-no-files-found: error

  # ---- publish: attach all built packages to a GitHub Release -------------
  # Only for listed tags (publish==true), and only when every build job it
  # needs actually succeeded.
  #
  # The `success() &&` is explicit ON PURPOSE (issue #61). A job-level `if:`
  # that uses no status-check function is a well-known source of surprise, and
  # since the macos job stopped being continue-on-error this condition is what
  # decides whether a failed .dmg stops the release. Spelling it out makes that
  # true by construction instead of by inference about defaults.
  #
  # It does NOT re-block the tolerated jobs: a job with `continue-on-error:
  # true` that fails reports `success` to the `needs` context (actions/toolkit
  # #1739), so a red `flatpak` still lets the release out and simply omits that
  # one bundle — exactly as before. A red `macos`, which is no longer tolerated,
  # now reports `failure` and skips this job.
  #
  # No `needs` job can be SKIPPED while this runs (the known case where
  # success() surprises): every build job is gated on build=='true', and
  # publish=='true' implies build=='true'.
  publish:
    needs: [gate, deb, rpm, src, windows, flatpak, macos]
    if: success() && needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Check out the repo (at the release tag) so the ChangeLog is available
      # to attach — the package jobs upload only build artifacts, so without a
      # checkout this job's workspace has no ChangeLog. Runs first: a later
      # checkout would wipe the downloaded dist/.
      - name: Check out (for the ChangeLog)
        uses: actions/checkout@v5
      - name: Download all package artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/**/*
            ChangeLog
          generate_release_notes: true
          fail_on_unmatched_files: false
