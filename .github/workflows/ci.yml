name: CI

# Task 69. Build + the full local test triplet (ctest unit/integration
# suites, FUSE Z80 opcode suite, screenshot/functional regression) on
# every push to main and every pull request.
#
# ── The SD-card image constraint (read before editing this file) ──────────
#
# `roms/*` is git-ignored (see .gitignore) — a fresh checkout has NO
# NextZXOS SD-card image. jnext's own test harness treats a missing image
# as a FATAL fault, never a silent skip:
#   * test/sd_rom_extractor/sd_rom_extractor_test.cpp exits non-zero with
#     no summary line if the SD image is absent — by
#     design, so an unprovisioned worktree can never quietly report a
#     smaller "still green" suite (see doc/testing/INTEGRATION-TEST-PLAN.md
#     §5 and test/unit-tests.conf's own header comment for the incident
#     that rule prevents).
#   * regression.sh self-provisions jnext's pristine fallback SD image
#     (see the "[sdcard-provision]" row in every regression.sh run) —
#     no test row passes `--sdcard` any more; every screenshot/functional
#     test relies on jnext's own default-location lookup.
# So EITHER `make unit-test` (via that one suite) OR `make regression`
# fails outright without an image — there is no honest way to run "most of
# it" and still call the job green. This workflow provisions the real
# image rather than skip/fake the tests that need it.
#
# The image jnext needs is the FAT32-patched form of cspect-next-1gb.img,
# the OFFICIAL public NextZXOS distribution published at specnext.com (see
# kDistroUrl in src/core/sdcard_provisioner.cpp). jnext ships its own
# provisioner for exactly this — the same code path an end user hits via
# `--sdcard-download-confirm` — so the "Provision NextZXOS SD image" step
# below simply runs jnext itself to download + FAT32-patch that public
# image into its default location ($HOME/.jnext/sdcard/), which both
# `make unit-test` (which clones it per run for sd_rom_extractor_test)
# and `make regression` (via its own self-provisioning step, which finds
# the image already there and does nothing) then use. This is not a secret
# or private asset and nothing here duplicates or bypasses the emulator's
# own sanctioned download path. The download+patch is cached (keyed on the
# distro URL) so the network is only actually hit once per cache
# generation. (GH #297: every job that builds a PGO binary needs the image
# too and restores the same entry — this file's `package` job, and the
# matching release.yml / windows-build.yml jobs; the macOS jobs keep their own
# -macos entry.) Because the image is now always the pristine distro copy
# (never a locally-contaminated fixture), the regression suite runs EVERY
# declared row, including `boot-nextzxos-dotls` (its SD-listing screenshot
# reference was regenerated against this same pristine image).
#
# Only ONE declared unit suite (sd_rom_extractor_test, 26 of 4728 rows)
# reads the image directly; every other suite in test/unit-tests.conf,
# including all the *_integration_test suites, is hermetic and needs
# nothing beyond the checkout + submodules.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LANG: C
  LC_ALL: C

jobs:
  # GH #295. ONE job definition, four PARALLEL legs, each its own runner:
  # build-matrix (link rot in all four ENABLE_QT_UI x ENABLE_DEBUGGER
  # combinations), unit (both suite-running configurations), unit-win (the
  # SDL-only suites as Windows executables under wine, GH #214) and regression
  # (the screenshot + functional suite). They were steps of one job, so the
  # 28-minute build matrix and the regression ran back to back; nothing in one
  # leg uses another's output. A matrix rather than three jobs keeps ONE copy
  # of the container, package list, checkout and caches below; each leg's
  # steps are still plain make targets, selected by `if: matrix.leg`.
  # fail-fast is off so a red leg never cancels the others' evidence.
  test:
    name: test (${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix:
        leg: [build-matrix, unit, unit-win, regression, regression-win]
    runs-on: ubuntu-latest
    # Same fedora:44 container release.yml builds the rpm and Windows artifacts
    # in, and the same distro the maintainer develops on. That is the point: the
    # committed man page, USAGE.md, rendered user guide and rendered developer
    # guide (including its Graphviz SVGs) are all GENERATED, and
    # pandoc/mkdocs-material/graphviz emit byte-different output across versions — so
    # a runner on a different distro reports a VERSION GAP as staleness. Ubuntu
    # shipped pandoc 3.1.3 against the maintainer's 3.7.0.2 and failed
    # docs-check on every run from the day the man page landed. Matching the
    # distro removes that whole class instead of pinning tool by tool.
    container: fedora:44
    timeout-minutes: 120
    # GH #202. Supplied as ENVIRONMENT, never by rewriting the commands: every
    # `run:` below stays the plain make target a human types locally, which is
    # the hard rule in CLAUDE.md. The generator reads $JNEXT_FPGA_SRC (and also
    # accepts --fpga-src=PATH); locally it needs neither, because it finds the
    # sibling checkout by walking up from its own directory.
    #
    # Scoped to THIS job on purpose. `traceability-check` is a prerequisite of
    # `make unit-test` only, and only this job runs it — pointing the other
    # jobs at a directory they never clone would be a lie waiting to be read.
    # Cloned OUTSIDE the workspace (runner.temp), never inside it. Same reason
    # CLAUDE.md puts agent worktrees outside the repo: anything that walks the
    # repository file list would walk this too — the generator itself does a
    # `find $ROOT -name CMakeLists.txt` to discover suites. The FPGA core
    # happens to contain no CMakeLists.txt today, which is luck, not a
    # guarantee, and an untracked 2.5 MB tree inside the checkout is a trap for
    # every other gate that reads `git status`.
    #
    # Only FPGA_CORE_REF is a job-level env. The two PATHS cannot be, because
    # they derive from the runner's temp dir and the `runner` context is NOT
    # available in `jobs.<id>.env` — only github/needs/strategy/matrix/vars/
    # secrets/inputs are. A `${{ runner.temp }}` here does not merely evaluate
    # empty: GitHub rejects the whole workflow file, so NO job runs and the
    # failure reads "This run likely failed because of a workflow file issue"
    # with no logs. The clone step below derives them from $RUNNER_TEMP and
    # exports them via $GITHUB_ENV, which is the supported way.
    env:
      FPGA_CORE_REF: b047011d82bf3086f2b7db76451c6254506f5fe8   # CORE VERSION 3.02.03
    steps:
      # MUST run BEFORE the checkout: a bare fedora:44 has no git, and
      # actions/checkout throws outright when `submodules` is requested
      # without it ("Input 'submodules' not supported when falling back to
      # download using the GitHub REST API"). release.yml's rpm and windows
      # jobs already order it this way for exactly this reason.
      #
      # Package set mirrors release.yml's rpm job (same fedora:44 container,
      # same dnf names) plus the tools the test
      # layers need on top: imagemagick (`compare`, screenshot diffing),
      # xvfb (audio-underrun-func's real-audio-device functional test —
      # every other GUI functional test uses QT_QPA_PLATFORM=offscreen and
      # needs no display), python3 (check-audio-underruns.py), unzip (the
      # SD-image provisioning step's own dependency, ultimately via
      # libcurl inside jnext, not this step directly, but kept explicit),
      # ripgrep (the tautological-assertion lint, run by BOTH `make unit-test`
      # and the regression preflight — GH #129), ffmpeg-free (video-record-func
      # and ffprobe; the same package the maintainer has locally), and bc/file/
      # xxd, which functional rows shell out to. That set was established by
      # checking every external command the suite invokes against a bare
      # fedora:44 plus this list, rather than discovering them one CI run at a
      # time.
      # git, make and diffutils come preinstalled on an Ubuntu runner but are
      # absent from the bare Fedora image, so they are explicit here.
      - name: Install build + test dependencies
        run: |
          dnf install -y \
            cmake gcc-c++ git make ccache \
            SDL3-devel zlib-devel libcurl-devel openssl-devel libpng-devel \
            qt6-qtbase-devel libspectrum-devel \
            ImageMagick xorg-x11-server-Xvfb xdotool python3 python3-pyyaml python3-jsonschema unzip diffutils \
            ripgrep ffmpeg-free bc file xxd \
            mtools dosfstools rpm-build \
            pandoc mkdocs-material graphviz liberation-sans-fonts \
            perl-interpreter perl-FindBin perl-File-Temp perl-PathTools
          # mtools + dosfstools are the FOREIGN validators the GH #269
          # sdcard-file-add-func row reads the SD image back with (mdir,
          # mcopy, fsck.vfat). They are not a convenience: jnext writes FAT32
          # there, and a filesystem writer checked only by its own reader is
          # the .szx defect this project already shipped once. That row FAILS
          # rather than skips when they are absent, so they are declared here.
          # rpm-build provides `rpmspec`, which test/packaging/sync-version-test.sh
          # (a contract suite of `make unit-test`) needs for its rpm-spec rows 12-13.
          # Without it they printed SKIP — hidden, because the contract wrapper read
          # only the exit status. A SKIP now fails the run, and the package job
          # installs the same package, so it is not a new tool.
          # z88dk-gdb (gdb-z88dk-func's client) is not packaged by Fedora and is not
          # installed here: `make regression` provisions it (`make z88dk-gdb`,
          # test/provision-z88dk-gdb.sh) with the curl, sha256sum, tar, make and cc
          # this image already has — the same command a developer runs locally.
          # The four perl-* entries are the traceability tooling's own
          # dependencies (test/refresh-traceability-matrix.pl,
          # test/traceability-citations-selftest.pl), declared rather than
          # inherited. They USED to arrive transitively — perl is not in the
          # bare fedora:44 image at all, and something above dragged it in —
          # which held until 2026-07-29, when `make unit-test` failed on
          # `Can't locate FindBin.pm` with no change to the script or the
          # workflow. Reproduced in the real image: after installing exactly
          # the list above, File::Temp/Cwd/File::Spec are present and FindBin
          # alone is not. Depending on another package's dependency graph is
          # precisely the "discover them one CI run at a time" failure the
          # comment above says this list exists to prevent.
          # libspectrum-devel is the ONLY foreign adjudication in this project
          # (GH #27 S9, design §13.2(1)). It builds `szx_probe`, which links the
          # library FUSE itself uses and reads a `.szx` jnext wrote, so
          # snapshot-foreign-szx-func can require jnext's `.jns` to agree with
          # an implementation nobody here can accidentally make permissive.
          # §13.1 is why that matters: jnext's `.szx` saver once wrote RAM
          # pages 0-111, its own loader accepted them, every test passed
          # byte-exact — and libspectrum rejects any page > 63, so every file
          # jnext could produce failed to load in real FUSE. Without this
          # package the row SKIPS, and a SKIP fails the run: the best evidence
          # in the design here is never silently lost.
          # python3-jsonschema is `make schema-check`'s FOREIGN validator, and is
          # declared for the same reason mtools is: the second half of that gate
          # hands doc/formats/jns-snapshot.schema.json to an implementation that
          # is not ours, and `test/snapshot/verify-schema.sh` FAILS (everywhere,
          # not just in CI) when the module is missing. It arrives
          # transitively from nothing in this list (checked with `dnf5 repoquery
          # --requires` across every package above, and `--whatrequires`), so
          # `make unit-test` fails in the container without it — reproduced
          # locally in a venv with no site-packages, exit 1. This gate was the
          # first one added to `make unit-test` whose tool was not already here;
          # docs-check's pandoc/mkdocs-material/graphviz and
          # traceability-check's four perl-* entries are the precedent.
          # liberation-sans-fonts is a docs dependency, not a font preference.
          # The developer guide's .dot sources ask for fontname="Helvetica",
          # which no installed font is actually NAMED: fontconfig resolves it,
          # and graphviz bakes the resulting TEXT METRICS into every coordinate
          # of the committed SVG. graphviz hard-requires urw-base35-fonts but
          # nothing pulls Liberation into the container, so the same dot 14.1.4
          # that renders system-overview.svg at 731x361 on the maintainer's
          # Fedora desktop (Helvetica -> Liberation Sans) renders it at 758x383
          # here (Helvetica -> Noto Sans), and docs-devguide-check reports all
          # four diagrams stale when nothing is stale. The version fingerprint
          # in DEVGUIDE_RENDERER cannot catch it: the dot version IS identical.
          # Verified in a real fedora:44 with the full list above — without this
          # package 758x383, with it all four SVGs byte-match the committed ones.
          # CMake shells out to `git submodule update`, which refuses on a
          # workspace owned by another uid ("dubious ownership", exit 128).
          # actions/checkout already placed the submodule so the build works
          # anyway, but the warning is noise on every configure.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # GH #214. The unit-win leg builds the SDL-only suites with the MinGW
      # cross toolchain and runs them under wine (`make unit-test-win`). The
      # `package` job installs a superset of this for the Windows packages; this
      # is the SDL-only subset (no Qt, no i686) plus wine, as windows-build.yml
      # names it. Its own step, so the other legs do not pull ~1 GB of cross
      # packages they never use.
      - name: Install the MinGW cross toolchain and wine
        if: matrix.leg == 'unit-win' || matrix.leg == 'regression-win'
        run: |
          dnf install -y \
            mingw64-gcc mingw64-gcc-c++ mingw64-binutils mingw64-filesystem \
            mingw64-SDL3 mingw64-zlib mingw64-libpng mingw64-winpthreads \
            wine-core wine-common
          # GH #319. The regression-win leg also builds the Qt frontend for
          # Windows (the build that ships, minus PGO), so it needs the MinGW Qt6.
          if [ "${{ matrix.leg }}" = regression-win ]; then dnf install -y mingw64-qt6-qtbase; fi

      - name: Check out
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # GH #202. doc/testing/TRACEABILITY-MATRIX.md is GENERATED and
      # staleness-gated, and the generator VALIDATES every VHDL citation
      # against the real FPGA core: with no core it cannot tell a typo'd
      # filename from a real one, so it publishes citations verbatim and
      # declines to fold a bare basename into its qualified path. That is
      # DIFFERENT BYTES from a run that has the core — so a byte-exact
      # staleness gate could never pass here and locally at the same time.
      # CI was red on main for exactly this, not for any test failure.
      #
      # PINNED to a commit rather than tracking master. The core is an
      # independent upstream repo; a tip that moved under us would change
      # which citations resolve and turn the gate red for a reason having
      # nothing to do with the commit under test. Bump it deliberately, in
      # step with the maintainer's own checkout — the same discipline as the
      # SD-image cache key above. The clone is partial + sparse because the
      # generator reads nothing but the `*.vhd` filenames under this one
      # directory.
      - name: Check out the ZX Next FPGA core (VHDL citation oracle)
        if: matrix.leg == 'unit'
        run: |
          FPGA_CORE_DIR="$RUNNER_TEMP/fpga-core"
          JNEXT_FPGA_SRC="$FPGA_CORE_DIR/cores/zxnext/src"
          git clone --filter=blob:none --no-checkout \
            https://gitlab.com/SpectrumNext/ZX_Spectrum_Next_FPGA.git "$FPGA_CORE_DIR"
          git -C "$FPGA_CORE_DIR" sparse-checkout init --cone
          git -C "$FPGA_CORE_DIR" sparse-checkout set cores/zxnext/src
          git -C "$FPGA_CORE_DIR" checkout "$FPGA_CORE_REF"
          test -d "$JNEXT_FPGA_SRC" || { echo "FPGA core missing at $JNEXT_FPGA_SRC"; exit 1; }
          echo "core at $(git -C "$FPGA_CORE_DIR" rev-parse HEAD)"
          echo "$(find "$JNEXT_FPGA_SRC" -name '*.vhd' | wc -l) .vhd files visible"
          # Hand it to every LATER step, so each `run:` stays a plain make target.
          echo "JNEXT_FPGA_SRC=$JNEXT_FPGA_SRC" >> "$GITHUB_ENV"

      # One cache per leg: the legs build different trees, and a cache entry
      # is saved once per key, so a shared key would keep only whichever leg
      # finished first. A miss falls back to any leg's entry.
      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-fedora44-${{ matrix.leg }}-${{ github.sha }}
          restore-keys: |
            ccache-fedora44-${{ matrix.leg }}-
            ccache-fedora44-

      # The unit leg needs it for sd_rom_extractor_test, the regression leg
      # for every row that boots NextZXOS; the build matrix runs nothing. The
      # unit-win leg needs it for sd_rom_extractor_test too, and on a miss
      # `make unit-test-win` provisions it itself (the `sdcard-image` target),
      # since that leg builds no PGO binary.
      - name: Cache NextZXOS SD-card image
        if: matrix.leg != 'build-matrix'
        id: sdcache
        uses: actions/cache@v5
        with:
          path: ~/.jnext/sdcard
          # kDistroUrl in src/core/sdcard_provisioner.cpp is versioned
          # (.../distro/24.11/...) — bump this key if that constant changes,
          # so a stale cached image is never reused silently.
          # -recipe2 is kFixedImageRecipe in the same file (GH #284). The
          # regression suite's gate re-derives a master of an older recipe on
          # its own, but a cache entry is never re-saved under a key that hit,
          # so without a bump every run would re-derive the same stale entry.
          # -fedora44 namespaces the container era: entries saved on a plain
          # ubuntu runner carry /home/runner paths and are useless (and
          # misleading) here. Bump with the container image, not just with
          # kDistroUrl.
          key: sdcard-image-distro-24.11-recipe2-fedora44

      # Mirrors the merge-to-main protocol in CLAUDE.md: `make clean` then
      # `make gui-release` first, so regression.sh (which prefers
      # build/gui-release/jnext) never picks up a stale binary.
      # Both test legs, as before the split. It is also what provisions the SD
      # image on a cache miss: gui-release's PGO training downloads it through
      # jnext's own --sdcard-download-confirm (tools/pgo-train.sh), and the
      # unit leg's sd_rom_extractor_test refuses to run without it — before
      # the split, this step and the regression ran ahead of `make unit-test`.
      - name: make clean && make gui-release
        if: matrix.leg == 'unit' || matrix.leg == 'regression'
        run: |
          LANG=C make clean
          LANG=C make gui-release

      # Link rot only shows up at BUILD time and only in the combinations the
      # default build does not exercise: CMake derives static-link order from
      # the declared dependency graph, so a target that under-declares still
      # links while some other library happens to supply its dependencies in a
      # usable position. Both known instances hid behind the debugger library
      # and appeared the moment it was switched off. Its own leg since GH #295;
      # it builds nothing else, so its warmth is its own ccache entry's.
      - name: Build matrix (every ENABLE_QT_UI x ENABLE_DEBUGGER combination)
        if: matrix.leg == 'build-matrix'
        run: LANG=C make build-matrix

      # No JNEXT_TEST_JOBS: the suite's lanes default to the runner's CPUs and
      # its timing-sensitive rows run in their own quiet phase (GH #295), so
      # this is the command a human types.
      - name: make regression (screenshot + functional suite)
        if: matrix.leg == 'regression'
        run: LANG=C make regression

      - name: make unit-test (ctest — FUSE Z80 + every subsystem/integration suite)
        if: matrix.leg == 'unit'
        run: LANG=C make unit-test

      # The SECOND configuration whose suites are actually run (GH #273). The
      # build matrix above proves all four LINK; until now nothing RAN a suite
      # in any configuration but the default, so a suite could stay red in a
      # supported one indefinitely — which is exactly what had happened. Owner
      # decision, 2026-09-25: the two configurations worth running are the
      # default Qt+debugger build and this SDL-only one; the other two are not
      # used in practice and stay build-only. Its own build directory, so it
      # never reconfigures the Qt build/ tree, and cheap here because ccache is
      # warm from the steps above.
      - name: make unit-test-sdl (the same suites in the SDL-only configuration)
        if: matrix.leg == 'unit'
        run: LANG=C make unit-test-sdl

      # GH #214. The SDL-only suites a third time, as WINDOWS executables (MinGW
      # cross build) run under wine, so a Windows compile break, a Win32 code path
      # or a path-separator bug in a suite fails a build instead of a user. Suites
      # the platform cannot have are declared absent by `# os:` in
      # test/unit-tests.conf (cross-checked both ways, never skipped). What wine
      # cannot stand in for -- symlink creation, a real console attach, NTFS
      # short names and streams -- stays untested; the developer guide lists it.
      # BLOCKING from the start (owner, 2026-10-10): a gate that cannot fail
      # anything is not a gate (the same reasoning as the `macos` job's).
      - name: make unit-test-win (the SDL-only suites as Windows executables under wine)
        if: matrix.leg == 'unit-win'
        run: LANG=C make unit-test-win

      # GH #319. The regression suite's screenshots and the functional rows an
      # OS can run, against the MinGW-built Windows executables under wine (the
      # shipped Qt build minus PGO, and the SDL-only build). Rows that cannot
      # exist on Windows are declared absent by `os=` in functional_tests.conf and
      # printed by name, never skipped; `# expect-windows:` pins the count.
      # BLOCKING from the start, for the reason unit-win is. The host tools the
      # rows run (xvfb, python3, mtools, ImageMagick ...) are the common list above.
      - name: make regression-win (the regression suite as Windows executables under wine)
        if: matrix.leg == 'regression-win'
        run: LANG=C make regression-win

      # Golden-screenshot + functional regression, in two steps.
      #
      # Step A (preflight) asserts the manifest pins agree — every declared
      # screenshot has a checked-in reference and vice-versa, and the
      # declared functional count matches — so CI still catches a
      # silently-shrunk suite. It needs no SD image.
      #
      # Step B runs the FULL declared suite (every screenshot + functional
      # row, no exclusions). regression.sh self-provisions the pristine SD
      # image itself (the "[sdcard-provision]" row), finds it already
      # present from the "Provision NextZXOS SD image" step above, and
      # every row — including boot-nextzxos-dotls, whose SD-listing
      # reference is now captured against this same pristine image — runs
      # against identical, reproducible SD-card content. This also means
      # the full grand-total witness (declared == reported) is enforced in
      # CI exactly as it is locally; no filtering, no partial-run carve-out.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: jnext-ci-failure-artifacts-${{ matrix.leg }}
          path: |
            test/00regression/img/*-diff.png
            build/test-summary.tsv
          if-no-files-found: ignore

      # GH #214. The built Windows test tree (executables and the suites' logs)
      # is kept for a week, so a run can be reproduced or inspected later
      # without rebuilding it. Not a gate: nothing depends on anyone using it.
      - name: Upload the Windows test tree
        if: always() && matrix.leg == 'unit-win'
        uses: actions/upload-artifact@v6
        with:
          name: jnext-unit-win-tree
          path: |
            build/win-sdl-unit-test/test/*.exe
            build/win-sdl-unit-test/test-logs
          retention-days: 7
          if-no-files-found: ignore

  # ── Qt5 compile guard (GH #108 Phase A) ─────────────────────────────────
  #
  # The Win7/8 legacy Windows packages build the SAME src/gui + src/debugger
  # against Qt 5.15 (JNEXT_FORCE_QT5). Nothing else in CI compiles that
  # combination, so a Qt6-only API creeping into the GUI would only be found
  # at release time, inside the MinGW cross job. This job is the
  # dual-maintenance enforcement: a plain `make qt5-guard-build` (the exact
  # target a developer runs locally) that configures with JNEXT_FORCE_QT5=ON,
  # builds the full GUI+debugger against native Linux Qt5, and runs
  # `jnext --version`. Build-only by design: the behavioural test triplet
  # runs against the default Qt6 build in the `test` job; this guard exists
  # to keep the Qt5 leg COMPILING. Its own job, in parallel — the test job
  # has no other use for Qt5.
  qt5-guard:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 30
    steps:
      # Same before-checkout ordering rule as the test job (bare fedora:44
      # has no git). Package set = the build-only subset of the test job's
      # list, with qt5-qtbase-devel replacing qt6-qtbase-devel.
      - name: Install build dependencies
        run: |
          dnf install -y \
            cmake gcc-c++ git make ccache \
            SDL3-devel zlib-devel libcurl-devel openssl-devel libpng-devel \
            qt5-qtbase-devel diffutils
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check out
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-qt5-fedora44-${{ github.sha }}
          restore-keys: |
            ccache-qt5-fedora44-

      - name: make qt5-guard-build
        run: LANG=C make qt5-guard-build

  # ── Packaging correctness (issue #61) ───────────────────────────────────
  #
  # `make package-test` builds every package (src/rpm/deb/win) and
  # asserts its CONTENTS — that the rpm/deb carry bin/jnext, that the source
  # zip carries the vendored submodule a naive `git archive` drops, that the
  # Windows zip carries the Qt6/SDL3 DLLs and the qwindows plugin, and that
  # jnext.exe is a GUI-subsystem binary (no stray console window). It also
  # runs the six packaging-SCRIPT contract suites, among them verify-bundle —
  # the GH #46 gate that rejects a .dmg referencing Homebrew.
  #
  # Until now it was invoked by NO workflow and NO target: release.yml proves
  # each package BUILDS, never that its contents are right, and that gap is
  # how #60 (a permanently-failing sync-version row) survived 46 tags.
  #
  # Its own job, not a step in `test`: it is ~4 minutes of package builds with
  # a toolchain the test job has no other use for, and as a separate job it
  # runs in PARALLEL — off the critical path of the much longer test job.
  #
  # `make package-test` is the same plain target a developer runs locally
  # (CLAUDE.md: CI runs the EXACT same commands as a local run). No pipe: with
  # GitHub's default `bash -e` and no `pipefail`, `make ... | tail` takes the
  # pipe's status and reports a failing suite green — that has already happened
  # in this repo.
  #
  # Missing tooling is a SKIP, and a SKIP fails the run everywhere (owner,
  # 2026-10-06): every tool below is installed deliberately, so a row that
  # silently stopped running could never read as a pass. The Flatpak BUILD is
  # not a row of this suite (it needs org.kde.Sdk — a multi-GB privileged
  # install); the `flatpak` job below builds and permission-gates the bundle,
  # and only the tool-free manifest contract (`flatpak-manifest`) runs here.
  package:
    runs-on: ubuntu-latest
    # fedora:44, same as the test job and the same container release.yml builds
    # the rpm and Windows artifacts in. Load-bearing for Windows: only Fedora
    # packages a MinGW Qt6, so this is the one host the cross-build works on.
    container: fedora:44
    # GH #297: every package-* target is a PGO build (instrument, train,
    # rebuild), so this job needs the NextZXOS SD image for the training —
    # restored by the same cache step as the `test` job (below) — and wine for
    # the Windows legs' training. The backstop went from 30 to 90 minutes (120 since 2026-10-03, owner): each
    # leg is two builds plus a training run now. Measured in a fedora:44
    # podman replay of this job on a 12-thread host: 19 min wall, 94 min of
    # user CPU — so a 4-vCPU runner needs roughly 30-45 min.
    timeout-minutes: 120
    steps:
      # Before the checkout: a bare fedora:44 has no git, and actions/checkout
      # rejects `submodules` without it.
      #
      # Package set = release.yml's rpm job (Fedora-native build deps) + its
      # windows job (the MinGW cross toolchain, package names copied from that
      # proven-green job) + dpkg/dpkg-dev/file for CPack's DEB generator
      # (CPACK_DEBIAN_PACKAGE_SHLIBDEPS is ON, which shells out to
      # dpkg-shlibdeps) + zip/unzip, which the src and win rows use, + mkdocs-material
      # for sync-version-test's mkdocs hook rows (a SKIP there fails the run).
      #
      # NOTE the deb built here is only checked for CONTENT (does it carry
      # bin/jnext). Do NOT "fix" this job into an Ubuntu container to make its
      # dependency metadata shippable: release.yml deliberately builds the
      # SHIPPED debs in pinned ubuntu:24.04/26.04 containers for that, and this
      # job would then lose the MinGW toolchain and the rpm in one move.
      - name: Install packaging toolchains
        run: |
          dnf install -y \
            cmake make gcc-c++ git ccache \
            SDL3-devel libcurl-devel openssl-devel zlib-devel libpng-devel \
            qt6-qtbase-devel \
            rpm-build dpkg dpkg-dev file zip unzip \
            findutils gawk grep coreutils diffutils \
            python3 python3-pyyaml mkdocs-material \
            mingw64-gcc mingw64-gcc-c++ mingw64-binutils mingw64-filesystem \
            mingw64-qt6-qtbase mingw64-SDL3 \
            mingw64-qt5-qtbase mingw64-qt5-qtbase-devel mingw64-qt5-qmake \
            mingw64-zlib mingw64-libpng mingw64-winpthreads \
            mingw32-gcc mingw32-gcc-c++ mingw32-binutils mingw32-filesystem \
            mingw32-SDL3 \
            mingw32-qt5-qtbase mingw32-qt5-qtbase-devel mingw32-qt5-qmake \
            mingw32-zlib mingw32-libpng mingw32-winpthreads \
            wine-core wine-common
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check out
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # Own cache namespace: the `test` job writes ccache-fedora44-<sha>, and
      # two jobs saving the same key collide (GitHub cache entries are
      # immutable). The compilations differ anyway — Release/no-tests here.
      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-fedora44-package-${{ github.sha }}
          restore-keys: |
            ccache-fedora44-package-

      # GH #297: the PGO training needs the NextZXOS SD image (the ROMs come
      # from it). The SAME cache entry as the `test` job above — same path, same
      # key — so the image is restored, not downloaded from specnext.com; only a
      # cache miss lets jnext's own provisioner download it (and this step then
      # saves it). The key's comment in ci.yml says when to bump it.
      - name: Cache NextZXOS SD-card image
        uses: actions/cache@v5
        with:
          path: ~/.jnext/sdcard
          key: sdcard-image-distro-24.11-recipe2-fedora44

      - name: make package-test (build every package, assert its contents)
        run: LANG=C make package-test

  # macOS is the ONE platform the regular push path did not cover.
  #
  # Windows already is, and adding a second Windows job here would duplicate
  # it: the `package` job above installs the full MinGW cross toolchain in the
  # same fedora:44 container and `make package-test` builds package-win,
  # package-win-qt5, package-win-sdl, package-win32-qt5 and package-win32-sdl,
  # asserting each zip's contents. macOS was excluded from that suite by
  # construction — packaging-test.sh:25 says so — because the .dmg needs a Mac.
  # Only verify-bundle.sh's CONTRACT was checked on Linux, never a real bundle.
  #
  # So until now a macOS break was invisible until release time, on the one
  # leg whose failure mode has actually bitten users: the v0.98.34 .dmg
  # referenced Homebrew paths and aborted in dyld on every Mac but the
  # builder's (GH #46). Finding that at tag time is finding it too late.
  #
  # Same plain make target a local Mac build uses, per the CI hard rule —
  # package-macos configures, builds, packages, then mounts the .dmg and
  # asserts with otool that nothing inside references Homebrew. The artifact is
  # uploaded so a macOS build can be tested WITHOUT cutting a release, which is
  # the other half of why the gap hurt.
  #
  # This is the only job needing a real macos-latest runner; every other job in
  # this file is fedora:44. It is deliberately NOT continue-on-error: a gate
  # that cannot fail anything is not a gate (the same reasoning release.yml's
  # macos job records).
  macos:
    runs-on: macos-latest
    # 45 -> 90 for GH #297 (120 since 2026-10-03, owner): package-macos is a PGO build (instrument,
    # train, rebuild), roughly twice the work.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies (Homebrew)
        run: brew install cmake sdl3 qt@6 curl openssl libpng
      # GH #297: the PGO training needs the NextZXOS SD image (the ROMs come
      # from it). Cached like ci.yml's `test` job, under its own -macos key:
      # a macOS runner's home is /Users/runner, not a container's /github/home,
      # so the Linux entries are not usable here. Only a cache miss lets jnext's
      # own provisioner download the image (and this step then saves it). Bump
      # the key together with ci.yml's.
      - name: Cache NextZXOS SD-card image
        uses: actions/cache@v5
        with:
          path: ~/.jnext/sdcard
          key: sdcard-image-distro-24.11-recipe2-macos

      - name: make package-macos (build, package, verify self-containment)
        run: CMAKE_PREFIX_PATH="$(brew --prefix qt@6)" make package-macos

      - uses: actions/upload-artifact@v6
        with:
          name: jnext-macos-dmg
          # BUILD_DIR_MAC_RELEASE, the same path release.yml's macos job
          # uploads. `if-no-files-found: error` so a renamed output directory
          # is a red job rather than a green one with no artifact in it.
          path: build/mac-release/*.dmg
          if-no-files-found: error

  # GH #214. The SDL-only unit suites on macOS. The `macos` job above builds and
  # packages but runs no suite, so a POSIX divergence in a suite or in the code it
  # tests (JOY-21: tcgetattr on a master pty, which Linux allows and macOS does not)
  # was invisible until a contributor with a Mac ran it by hand. Same plain make
  # target a human types on a Mac. BLOCKING from the start (owner, 2026-10-10), for
  # the same reason as `macos`: a gate that cannot fail anything is not a gate.
  #
  # run-unit-tests.sh needs bash >= 4, GNU timeout, GNU `grep -P` and GNU cp, none
  # of which macOS ships (bash 3.2, BSD userland): Homebrew's bash, coreutils and
  # grep are installed here and `make unit-test-sdl` puts them first on PATH for
  # its own recipe, so a developer's Mac works the same way. A failing suite is
  # named, with its FAIL lines, in the harness output of this very step; the
  # suites' full logs are uploaded as an artifact on failure.
  macos-unit:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies (Homebrew)
        run: brew install cmake sdl3 curl openssl libpng bash coreutils grep ccache
      # Under the `macos` job's key: the same image, the same /Users/runner home.
      # On a miss `make unit-test-sdl` provisions it itself (the `sdcard-image`
      # target), and this step then saves it.
      - name: Cache NextZXOS SD-card image
        uses: actions/cache@v5
        with:
          path: ~/.jnext/sdcard
          key: sdcard-image-distro-24.11-recipe2-macos

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/ccache
            ~/.cache/ccache
          key: ccache-macos-unit-${{ github.sha }}
          restore-keys: |
            ccache-macos-unit-

      - name: make unit-test-sdl (the SDL-only suites on macOS)
        run: CMAKE_PREFIX_PATH="$(brew --prefix)" LANG=C make unit-test-sdl

      - name: Upload the suites' logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: jnext-macos-unit-logs
          path: build/sdl-unit-test/test-logs
          if-no-files-found: ignore

  # GH #319. The regression suite on macOS: the screenshots and the functional
  # rows macOS can run (`os=` in test/00regression/functional_tests.conf; the
  # rest are printed by name as absent, never skipped), against the Qt frontend
  # that ships in the dmg and the SDL-only one. A job of its own, beside
  # macos-unit, so a red run says which half broke. BLOCKING, like macos-unit.
  macos-regression:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # The regression rows shell out to ffmpeg/ffprobe (video-record family),
      # ImageMagick (screenshot diffs), mtools + dosfstools (the SD-card foreign
      # validators), libspectrum (the foreign snapshot reader) and python3.
      - name: Install dependencies (Homebrew)
        run: brew install cmake sdl3 qt@6 curl openssl libpng bash coreutils grep ccache imagemagick mtools dosfstools ffmpeg
      # snapshot-schema-func's FOREIGN validator is python's jsonschema (a SKIP
      # fails the run, so it is declared, like the dnf list of the Linux legs).
      - name: Install python jsonschema
        run: python3 -m pip install --break-system-packages jsonschema pyyaml
      - name: Cache NextZXOS SD-card image
        uses: actions/cache@v5
        with:
          path: ~/.jnext/sdcard
          key: sdcard-image-distro-24.11-recipe2-macos

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/ccache
            ~/.cache/ccache
          key: ccache-macos-regression-${{ github.sha }}
          restore-keys: |
            ccache-macos-regression-

      - name: make regression-macos (the regression suite on macOS)
        run: CMAKE_PREFIX_PATH="$(brew --prefix):$(brew --prefix qt@6)" LANG=C make regression-macos

      # The GH #245 rule, as evidence: a timing row that failed under the parallel
      # phase's load is re-run SOLO on the now idle runner. A pass here says the
      # failure was load; a fail says it is the platform. Runs only on a red run.
      - name: Re-run the real-time rows solo (evidence for a red run)
        if: failure()
        run: CMAKE_PREFIX_PATH="$(brew --prefix):$(brew --prefix qt@6)" LANG=C make regression-macos ROWS="audio-underrun-func sdl-options-func dzrp-paused-headless-func"

      - name: Upload the failing rows' artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: jnext-macos-regression-artifacts
          path: |
            test/00regression/img/*-diff.png
          if-no-files-found: ignore

  # The flatpak bundle, actually BUILT on every push rather than skipped — and,
  # since it now goes through the shared definition, PERMISSION-GATED on every
  # push too.
  #
  # The `package` job above cannot build it: `make package-test` carries only
  # the manifest contract, since the real build needs org.kde.Sdk. Installing
  # flatpak-builder into that fedora:44 container does NOT fix it — the missing
  # piece is the org.kde.Sdk//6.10 RUNTIME, a multi-gigabyte Flathub download,
  # and flatpak-builder additionally needs a privileged container for
  # bubblewrap's user namespaces. So the manifest was checked and the build was
  # not, on every push, since the day the manifest landed.
  #
  # This used to be release.yml's flatpak job copied near-verbatim. It is now
  # the SAME job: .github/workflows/flatpak-build.yml, which release.yml also
  # calls and which can be dispatched by hand. That file's header carries the
  # project's ONE declared exception to "every CI step is a plain make target"
  # (it builds through the upstream flatpak-builder action) and the GH #271
  # permission gate — read it there, not here. Three near-identical copies of a
  # build is three places for the container pin to drift, and the copy here had
  # already lost something real — it never ran the GH #271 permission gate, so
  # a bundle that silently stopped carrying --share=network went green here on
  # every push. Calling the shared definition fixes that by construction.
  #
  # Consequence worth knowing: the bundle is now named after version.yaml
  # (jnext-<ver>-x86_64.flatpak) instead of jnext-ci-x86_64.flatpak, and shares
  # the release cache key. Nothing consumes this job's artifact, and the same
  # commit produces the same bundle either way, so the names were the only
  # difference worth keeping — and not worth a workflow input that would also
  # have to appear on the manual entry point's Run-workflow form.
  #
  # One further delta, recorded so it is a decision and not drift: a `uses:` job
  # cannot carry `env:`, and a called workflow does not inherit the caller's, so
  # this job no longer sees this file's workflow-level LANG=C/LC_ALL=C. Pinning
  # the locale inside the shared definition instead would have changed
  # release.yml's flatpak job, which must stay as it was.
  #
  # Would the gate still be correct under a translated locale? Yes, and the
  # reason is structural rather than lucky, so it is worth writing down where
  # someone will look for it. packaging/flatpak/verify-permissions.sh decides on
  # exactly two things, neither of which a locale can move:
  #
  #   * the GKeyFile group name `[Context]` and the key `shared=`, which are
  #     flatpak's ON-DISK metadata format — the bytes of the app's own
  #     `metadata` file, echoed back by `flatpak info --show-permissions`. A
  #     translated flatpak would still have to emit them verbatim or nothing
  #     could parse an app's permissions at all. The token comparison is then
  #     `[ "$tok" = network ]` against a value, not against prose;
  #   * process EXIT STATUS — `flatpak install` and `flatpak info` are tested
  #     with `if !` and `|| die`, never by matching their message text.
  #
  # Localised text reaches only the human-readable log the script dumps on a
  # failed install. The one remaining locale-adjacent assumption is that
  # `flatpak list --columns=application` prints no column header to a pipe; the
  # value it prints is an app id, which is not translatable either.
  #
  # NOT continue-on-error — here the entire purpose is to go red when the bundle
  # stops building or stops carrying its permissions.
  flatpak:
    uses: ./.github/workflows/flatpak-build.yml
