name: Bug report
description: Report incorrect emulation, a crash, or other broken behaviour
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. The **version**, **platform** and **emulated
        machine** are the most useful fields for triage — please fill them in.
  - type: input
    id: version
    attributes:
      label: jnext version
      description: Output of `jnext --version` (or the release/package you installed).
      placeholder: e.g. 0.98.34
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform / package
      description: How you got jnext.
      options:
        - Linux — RPM (Fedora/RHEL)
        - Linux — DEB (Debian/Ubuntu)
        - Linux — Flatpak
        - Windows (x64 zip)
        - macOS Apple Silicon (.dmg)
        - macOS Intel (.dmg)
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / version
      description: Operating system and version.
      placeholder: e.g. Fedora, Debian, Windows, macOS — include the version
    validations:
      required: true
  - type: dropdown
    id: machine
    attributes:
      label: Emulated machine
      description: The `--machine` type in use, if relevant.
      options:
        - Next (default)
        - 48K
        - 128K
        - "+3"
        - Not sure / not relevant
    validations:
      required: false
  - type: dropdown
    id: real-hardware
    attributes:
      label: Happens on real hardware?
      description: Reproduced on a physical ZX Spectrum Next? Helps tell an emulator bug from genuine hardware behaviour.
      options:
        - "Yes"
        - "No"
        - Not tested
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact steps, including the full command line if you used the CLI.
      placeholder: |
        1. Run `jnext --machine next --load game.nex`
        2. ...
        3. See ...
    validations:
      required: true
  - type: input
    id: media
    attributes:
      label: Program / media
      description: The file or SD image involved (NEX/TAP/TZX/SNA/SZX/Z80/WAV/RZX), if any. Attach it if you can share it.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ### A NEX program that does not work

        `--load` starts a NEX without NextZXOS, so a program that reads its own files
        (a data folder next to the NEX, for example) may behave differently there.
        Before reporting, please try both of these:

        1. **From the SD card, like a real Next.** Copy the NEX (and its data folder,
           if it has one) onto the card, then start jnext, open the NextZXOS Browser
           and run it from there:
           ```
           jnext --sdcard-file-add game.nex
           jnext --sdcard-file-add game-data-folder
           jnext
           ```
        2. **With `--load` and each esxDOS emulation mode**, from the directory that
           holds the NEX and its files:
           ```
           jnext --load game.nex --esxdos-stub
           jnext --load game.nex --esxdos-stub-root .
           jnext --load game.nex --esxdos-stub-root . --esxdos-stub-writable
           ```
           The last one lets the program write to that directory.
  - type: dropdown
    id: nex-browser
    attributes:
      label: "NEX only: run from the NextZXOS Browser"
      description: Result of step 1 above.
      options:
        - Not a NEX problem
        - Fails the same way there
        - Works there (fails only with --load)
    validations:
      required: true
  - type: dropdown
    id: nex-esxdos-stub
    attributes:
      label: "NEX only: run with the esxDOS emulation modes"
      description: Result of step 2 above. Say which modes work in "What happened?".
      options:
        - Not a NEX problem
        - Fails the same way in all three modes
        - Works in at least one mode
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant stderr output. Re-running with e.g. `--log-level cpu=debug,video=debug` often helps.
      render: shell
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag-and-drop images that show the problem (a wrong render is worth a screenshot).
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: I'm on the latest release, or I've stated my version above.
          required: true
