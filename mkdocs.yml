      - 9.1 Command-line options: 09-reference/01-command-line-options.md
      - 9.2 Files and directories: 09-reference/02-files-and-directories.md
      - 9.3 ZX Spectrum Next hardware documentation: 09-reference/03-zx-spectrum-next-hardware-documentation.md
      - 9.4 The project: 09-reference/04-the-project.md

# Make `mkdocs build --strict` fail on the two classes of breakage this guide
# is most exposed to now that it is split across 70 files: a page missing from
# the nav, and a cross-reference to an anchor that no longer exists.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

# The TOC skeleton is kept out of the built site; it is a working document.
exclude_docs: |
  TOC.md
