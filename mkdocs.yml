# Make `mkdocs build --strict` fail on the two classes of breakage this guide
# is most exposed to now that it is split across 70 files: a page missing from
# the nav, and a cross-reference to an anchor that no longer exists.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

# The jnext version this guide was rendered from — shown top-right as "This
# version", beside "Latest version", which the page fetches live from
# version.yaml on GitHub main (src/doc/user-guide-overrides/partials/source.html).
# Together they answer "is the guide I am reading current?".
#
# DO NOT hand-edit: packaging/sync-version.sh rewrites this from version.yaml on
# every `make bump-*` and re-renders the guide in the same step. It is a
# committed literal because the value is baked into every page at render time
# and docs-userguide-check byte-diffs a fresh render — so config and rendered
# output must move together, which is exactly what sync-version.sh guarantees.
extra:
  doc_release: v0.99.126

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

# The TOC skeleton is kept out of the built site; it is a working document.
exclude_docs: |
  TOC.md
